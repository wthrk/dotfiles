name: Zsh checks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zsh:
    name: zsh checks
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: zsh checks
        run: nix develop -c cargo xtask check zsh
