name: Zsh checks

on:
  workflow_dispatch:
  pull_request:
  # nightly bump PR は `github.token` で起票するため `on: pull_request` が発火せず、その auto-merge が作る
  # main への push も同じ理由で workflow を起動しない。flake.lock bump が持ち込む zsh 退行を拾う経路は
  # 週次実行だけである。
  schedule:
    - cron: "0 15 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zsh:
    name: zsh checks
    # 検証対象の zsh 挙動は利用者の実機（macOS 26）上のものなので runner も同じ版に固定する。`macos-latest` は
    # GitHub が指す先を移すたびに image が変わり、検証している zsh・端末・補完の前提が黙って動く。
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # `/nix/store` はキャッシュしない。PR gate になったため static-checks.yml と同じ判断を採る。macOS runner の
      # 復元は 1 時間規模に達しうる。store path は cache.nixos.org から substitute する。

      # 検証は適用済み環境を起動するだけなので、runner をここで実機と同じ状態にする。
      - name: 構成を適用
        env:
          # 実フリートの `home-manager.backupFileExtension` と同じ値。standalone activation では
          # この指定が無いと既存ファイルを前にして止まる。
          HOME_MANAGER_BACKUP_EXT: before-home-manager
        run: |
          nix run .#default -- init --source "path:$PWD"
          nix run .#default -- switch home

      - name: zsh checks
        run: nix develop -c bats --print-output-on-failure tests/zsh
