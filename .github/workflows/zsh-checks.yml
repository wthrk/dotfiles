name: Zsh checks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zsh:
    name: zsh checks
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # /nix/store を run 間でキャッシュする（nightly-update.yml / static-checks.yml と同 action・同 key 規約）。
      # toolchain と `nix flake` 系 / devShell の取得物を再利用する。重い closure は無く保存物は小さい。
      # miss/失敗は遅くなるだけで fail させない（fail-on 既定 = fail-safe）。
      - name: /nix/store をキャッシュ
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust/dotfiles-cli/Cargo.toml', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size: 3G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # cargo build キャッシュ（~/.cargo + target/）を run 間で再利用する。Nix devShell でビルドした成果物を
      # 安全に再利用するため、cache key に flake.lock を含め、rust-cache 自身の cargo/rustc 判定も
      # `nix develop -c` で実行して Nix shell 上の Rust 環境に合わせる。static-checks（ubuntu）とは runner.os が
      # 異なり shared-key も別のためキャッシュは衝突しない。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: zsh-checks-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          cmd-format: nix develop -c {0}

      - name: zsh checks
        run: nix develop -c cargo xtask check zsh
