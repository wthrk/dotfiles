name: Zsh checks

on:
  workflow_dispatch:
  pull_request:
  # PR が読める cache は既定ブランチ scope のものだけ。main でも走らせて populate する。
  push:
    branches:
      - main
  # nightly bump PR は `github.token` で起票するため `on: pull_request` が発火しない。flake.lock bump が
  # 持ち込む zsh 退行を拾う経路は、その auto-merge 後の main push と週次実行である。
  schedule:
    - cron: "0 15 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zsh:
    name: zsh checks
    # 検証対象の zsh 挙動は利用者の実機（macOS 26）上のものなので runner も同じ版に固定する。`macos-latest` は
    # GitHub が指す先を移すたびに image が変わり、検証している zsh・端末・補完の前提が黙って動く。
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # `/nix/store` はキャッシュしない。PR gate になったため static-checks.yml と同じ判断を採る。macOS runner の
      # 復元は 1 時間規模に達しうる。store path は cache.nixos.org から substitute する。

      # 検証は適用済み環境を起動するだけなので、runner をここで実機と同じ状態にする。
      # 適用は実機と同じく nix build 済みの CLI を使うため、この job は dotfiles-cli を build する。
      # derivation hash は build 入力の関数なのでそのまま cache key にでき、Rust workspace を触らない
      # 変更ではキーが動かず PR でも命中する。static-checks.yml と同じ仕組みだが、`runner.os` が違うので
      # cache は別物であり、上の main push が populate を担う。
      - name: dotfiles-cli の derivation を確定
        id: cli
        run: |
          set -euo pipefail
          drv="$(nix path-info --derivation .#dotfiles-cli)"
          echo "key=$(basename "$drv" .drv)" >> "$GITHUB_OUTPUT"

      - name: dotfiles-cli ビルド成果物キャッシュを復元
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dotfiles-nixcache
          key: dotfiles-cli-nix-${{ runner.os }}-${{ steps.cli.outputs.key }}

      - name: 成果物を store へ復元
        if: steps.cli-cache.outputs.cache-hit == 'true'
        run: nix copy --from "file://$HOME/.cache/dotfiles-nixcache" --no-check-sigs .#dotfiles-cli

      - name: 構成を適用
        env:
          # 実フリートの `home-manager.backupFileExtension` と同じ値。standalone activation では
          # この指定が無いと既存ファイルを前にして止まる。
          HOME_MANAGER_BACKUP_EXT: before-home-manager
        run: |
          nix run .#default -- init --source "path:$PWD"
          nix run .#default -- switch home

      # 保存は main scope 限定。PR scope の cache は他 PR から読めず、上限を圧迫して main の分を evict する。
      - name: 成果物をキャッシュへ書き出し
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        run: nix copy --to "file://$HOME/.cache/dotfiles-nixcache?compression=zstd" --no-check-sigs .#dotfiles-cli

      - name: 成果物キャッシュを保存
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dotfiles-nixcache
          key: dotfiles-cli-nix-${{ runner.os }}-${{ steps.cli.outputs.key }}

      - name: zsh checks
        run: nix develop -c bats --print-output-on-failure tests/zsh
