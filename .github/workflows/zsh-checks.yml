name: Zsh checks

on:
  workflow_dispatch:
  pull_request:
  # nightly bump PR は `github.token` で起票するため `on: pull_request` が発火せず、その auto-merge が作る
  # main への push も同じ理由で workflow を起動しない。flake.lock bump が持ち込む zsh 退行を拾う経路は
  # 週次実行だけである。
  schedule:
    - cron: "0 15 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zsh:
    name: zsh checks
    # 検証対象の zsh 挙動は利用者の実機（macOS 26）上のものなので runner も同じ版に固定する。`macos-latest` は
    # GitHub が指す先を移すたびに image が変わり、検証している zsh・端末・補完の前提が黙って動く。
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # `/nix/store` はキャッシュしない。PR gate になったため static-checks.yml と同じ判断を採る。macOS runner の
      # 復元は 1 時間規模に達しうる。store path は cache.nixos.org から substitute する。

      # cargo のビルド成果物キャッシュは持たない。この job が build するのは Home Manager の activation package
      # だけであり、Rust の成果物を必要としないため、復元する `target/` が無い。
      - name: zsh checks
        run: nix develop -c bats --print-output-on-failure tests/zsh
