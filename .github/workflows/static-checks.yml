name: Static checks

on:
  workflow_dispatch:
    inputs:
      target:
        description: "手動実行する静的検証"
        required: true
        default: all
        type: choice
        options:
          - all
          - flake-check
          - home-runner
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    access-tokens = github.com=${{ github.token }}

jobs:
  flake-check:
    name: nix flake check
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'flake-check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: flake.lock を確認
        run: test -s flake.lock

      - name: Nix を導入
        uses: DeterminateSystems/nix-installer-action@v20
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: nix flake check
        run: |
          set -euxo pipefail
          nix --extra-experimental-features "nix-command flakes" flake check --no-update-lock-file

      - name: nix format を確認
        run: |
          set -euxo pipefail
          nix --extra-experimental-features "nix-command flakes" fmt -- --check $(git ls-files '*.nix')

      - name: zsh shortcuts を検証
        run: |
          set -euxo pipefail
          nix --extra-experimental-features "nix-command flakes" shell nixpkgs#bash nixpkgs#zsh nixpkgs#ripgrep --command bash scripts/test-zsh-shortcuts.sh

      - name: zsh key operations を検証
        run: |
          set -euxo pipefail
          nix --extra-experimental-features "nix-command flakes" shell nixpkgs#bash nixpkgs#zsh nixpkgs#ripgrep --command bash scripts/test-zsh-key-operations-full.sh

  eval-runner:
    name: runner Home Manager output を評価
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'home-runner' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: flake.lock を確認
        run: test -s flake.lock

      - name: Nix を導入
        uses: DeterminateSystems/nix-installer-action@v20
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: runner Home Manager output を評価
        run: |
          set -euxo pipefail
          nix --extra-experimental-features "nix-command flakes" eval --no-update-lock-file .#homeConfigurations.runner.activationPackage.drvPath
