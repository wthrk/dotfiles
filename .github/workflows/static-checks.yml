name: Static checks

on:
  workflow_dispatch:
    inputs:
      target:
        description: "手動実行する静的検証"
        required: true
        default: all
        type: choice
        options:
          - all
          - static
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'static' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: static checks
        run: nix develop -c cargo xtask check static
