name: Static checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # /nix/store を run 間でキャッシュする（nightly-update.yml と同 action・同 key 規約）。toolchain と
      # `nix flake check` / devShell の取得物を再利用して install/eval を高速化する。eval ベース化で
      # 重い closure は無く保存物は小さい。miss/失敗は遅くなるだけで fail させない（fail-on 既定 = fail-safe）。
      - name: /nix/store をキャッシュ
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust/dotfiles-cli/Cargo.toml', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size: 3G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # cargo build キャッシュ（~/.cargo + target/）を run 間で再利用する。`cargo xtask check static` は
      # devShell 内で workspace をコンパイルするため、/nix/store キャッシュ（toolchain / nix 依存）とは別に
      # target/ の再ビルド回避が効く。restore-key で前回 PR の target/ から差分ビルドに縮退する。fail-safe。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-checks-${{ runner.os }}

      - name: static checks
        run: nix develop -c cargo xtask check static
