name: Static checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # `cache-nix-action` の post-step が required check を長時間 pending のまま残す事例があったため、
      # static checks では `/nix/store` キャッシュを使わない。toolchain / devShell は毎回取得するが、
      # job 自体は deterministic に完走させる。

      # cargo registry/git キャッシュ（~/.cargo）だけを run 間で再利用する。Nix devShell 内でビルドした
      # build script は `/nix/store` 上の動的ライブラリに結び付くため、target/ 復元まで行うと GC 済み store path を
      # 指した古い実行ファイルを踏んで `No such file or directory` で落ちうる。依存 crate の取得だけ再利用し、
      # workspace のビルド成果物は毎回その場の devShell で再生成する。fail-safe。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-checks-${{ runner.os }}
          cache-targets: false

      - name: static checks
        run: nix develop -c cargo xtask check static
