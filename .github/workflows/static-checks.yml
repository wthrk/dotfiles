name: Static checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # /nix/store を run 間でキャッシュする（nightly-update.yml と同 action・同 key 規約）。toolchain と
      # `nix flake check` / devShell の取得物を再利用して install/eval を高速化する。eval ベース化で
      # 重い closure は無く保存物は小さい。miss/失敗は遅くなるだけで fail させない（fail-on 既定 = fail-safe）。
      - name: /nix/store をキャッシュ
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust/dotfiles-cli/Cargo.toml', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size: 3G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # cargo registry/git キャッシュ（~/.cargo）だけを run 間で再利用する。Nix devShell 内でビルドした
      # build script は `/nix/store` 上の動的ライブラリに結び付くため、target/ 復元まで行うと GC 済み store path を
      # 指した古い実行ファイルを踏んで `No such file or directory` で落ちうる。依存 crate の取得だけ再利用し、
      # workspace のビルド成果物は毎回その場の devShell で再生成する。fail-safe。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-checks-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          cache-targets: false

      - name: static checks
        run: nix develop -c cargo xtask check static
