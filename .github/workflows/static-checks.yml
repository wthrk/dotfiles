name: Static checks

on:
  workflow_dispatch:
  pull_request:
  # PR が読める cache は既定ブランチ scope のものだけ。main でも走らせて populate する。
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # `cache-nix-action` の post-step が required check を長時間 pending のまま残す事例があったため、
      # static checks では `/nix/store` キャッシュを使わない。toolchain / devShell は毎回取得するが、
      # job 自体は deterministic に完走させる。

      # 復元する target/ の正しさを縛るのは、build script が link した C ライブラリと使った toolchain の
      # store path だけである。`.#cargo-build-inputs` はその集合だけを入力に持つ derivation で、drv hash は
      # 入力の関数なのでそのまま cache key にできる。`flake.lock` のハッシュをキーにすると nightly bump の
      # たびに必ず別キーになり、bump 後 lock で走る nightly open-pr がこの cache へ到達できない。
      - name: cargo build closure の derivation を確定
        id: closure
        run: |
          set -euo pipefail
          drv="$(nix path-info --derivation .#cargo-build-inputs)"
          echo "key=$(basename "$drv" .drv)" >> "$GITHUB_OUTPUT"

      # Nix devShell 内の cargo/rustc を基準に target/ まで再利用する。toolchain 不一致の target/ を復元しない
      # ことは shared-key の `.#cargo-build-inputs` drv 名が担う。rust-cache が渡すフォールバックキーは
      # prefix + shared-key + OS/arch + rust environment hash までで shared-key を落とさないため、drv が違う
      # 世代の target/ には到達しない。`cmd-format` はヒット率のために要る。これが無いと rust environment hash が
      # runner 側 rustup の `rustc -vV` で決まり、runner image が toolchain を入れ替えるたびにキーが動く。
      # この job は lock を書き換えないため、`nix develop` は job 中ずっと同じ devShell を解決する。
      # shared-key は nightly-update.yml の open-pr job と共有する（同じ `cargo xtask check static` を走らせ、
      # bump で closure が動かない晩は同じキーになる）。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-checks-${{ runner.os }}-${{ steps.closure.outputs.key }}
          cmd-format: nix develop -c {0}
          cache-targets: true
          # PR scope の cache は他 PR から読めず、target/ を含むと 10GB 上限を圧迫して main の分を evict する。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: static checks
        run: nix develop -c cargo xtask check static

      # derivation path を先に確定させる。この hash は全入力（Rust ソース・Cargo.lock・flake.lock・
      # buildInputs / nativeBuildInputs）の関数なので、そのままキャッシュキーとして使える。
      - name: dotfiles-cli の derivation を確定
        id: cli
        run: |
          set -euo pipefail
          drv="$(nix path-info --derivation .#dotfiles-cli)"
          echo "key=$(basename "$drv" .drv)" >> "$GITHUB_OUTPUT"

      # ランナーの `/nix/store` は毎回空なので、何もしないと 427 crate を毎回コンパイルし直すことになる
      # （実測 7〜12 分）。dotfiles-cli の closure を run 間で持ち回ってこれを消す。closure は 178 path・
      # zstd 圧縮で約 370MB（うち dotfiles-cli 自身は 5MB、残りは cache.nixos.org にもある標準 path）。
      # 単体 path だけを持ち回る手もあるが、復元時に参照先が store に無く import が通らないため closure ごと運ぶ。
      - name: dotfiles-cli ビルド成果物キャッシュを復元
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: .nixcache
          key: dotfiles-cli-nix-${{ runner.os }}-${{ steps.cli.outputs.key }}

      - name: 成果物を store へ復元
        if: steps.cli-cache.outputs.cache-hit == 'true'
        run: nix copy --from "file://$PWD/.nixcache" --no-check-sigs .#dotfiles-cli

      # static checks は devShell 内で走るため、build sandbox でしか露見しない依存欠落を検出できない。
      # bootstrap が叩く derivation そのものを PR でも build する。derivation は `doCheck = false` なので
      # ここで検出できるのは buildPhase の compile / link に現れる欠落までで、checkPhase だけが起動する
      # 依存（#84 の git がそれ）は対象外。
      #
      # 上で成果物を復元できた場合、nix は out path が既に valid なのを見てビルドを省く。これは検出力を
      # 落とさない: キーは全入力の関数なので、`db251c0` のように buildInputs / nativeBuildInputs へ穴が開く
      # 変更をすれば必ず別キーになり、cache miss → 実ビルドで欠落が露見する。
      - name: dotfiles-cli の nix build
        run: nix build .#dotfiles-cli --no-link --print-build-logs

      # 保存は main scope 限定（cargo cache と同じ理由）。PR 側が保存しても、その cache は同じ PR からしか
      # 読めない上に 1 件 370MB あり、Rust ソースを触った PR は次 run で必ず別キーになるため再利用もされない。
      # 全 PR が読める main scope の entry を 1 commit につき 1 件だけ積む。
      - name: 成果物をキャッシュへ書き出し
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        run: nix copy --to "file://$PWD/.nixcache?compression=zstd" --no-check-sigs .#dotfiles-cli

      - name: 成果物キャッシュを保存
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: .nixcache
          key: dotfiles-cli-nix-${{ runner.os }}-${{ steps.cli.outputs.key }}
