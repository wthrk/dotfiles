name: Static checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: static checks
        run: nix develop -c cargo xtask check static

  # 版管理された ruleset（.github/rulesets/nightly-bump.json）が GitHub に正しく適用され続けているかを
  # 継続検証する。手動 gh api 適用が漏れ・改竄・context ドリフトしていれば fail し、required status check
  # nightly-bump-guard の無効化（fail-open）を検知する。
  #
  # ruleset 読み取りは repo の Administration:read 権限を要する。既定 GITHUB_TOKEN は ruleset を読めないため、
  # nightly bump と同じ最小権限 GitHub App（Administration:read を付与した NIGHTLY_BUMP_APP）の token で読む。
  # App secret 未設定（fork PR 等で利用不可）の場合は gh が token 無し / 権限不足で非 0 終了し、検証は
  # fail-closed（検証不能を success にしない）。App は contents/PR/checks に加え Administration:read のみを持つ。
  ruleset:
    name: verify applied ruleset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: GitHub App token を生成
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NIGHTLY_BUMP_APP_ID }}
          private-key: ${{ secrets.NIGHTLY_BUMP_APP_PRIVATE_KEY }}

      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: verify applied ruleset
        env:
          # gh は GH_TOKEN を env から読む。token は argv に乗せない（ログ非混入）。
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: nix develop -c dotfiles ci verify-ruleset
