name: Static checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # `cache-nix-action` の post-step が required check を長時間 pending のまま残す事例があったため、
      # static checks では `/nix/store` キャッシュを使わない。toolchain / devShell は毎回取得するが、
      # job 自体は deterministic に完走させる。

      # cargo registry/git と target/ を run 間で再利用する。`cache-targets: false` だと static checks は毎回
      # workspace を冷ビルドし続けて required check が過度に遅くなる。代わりに cache key を `flake.lock` /
      # `flake.nix` に縛り、Nix devShell が変わった run と target/ を混在させない。これで同一 shell では
      # build 成果物を再利用しつつ、shell 更新時は自動で cache miss に倒す。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-checks-${{ runner.os }}
          key: static-checks-${{ hashFiles('flake.lock', 'flake.nix') }}
          cache-targets: true

      - name: static checks
        run: nix develop -c cargo xtask check static
