name: Static checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # `cache-nix-action` の post-step が required check を長時間 pending のまま残す事例があったため、
      # static checks では `/nix/store` キャッシュを使わない。toolchain / devShell は毎回取得するが、
      # job 自体は deterministic に完走させる。

      # cargo build キャッシュ（~/.cargo + target/）を run 間で再利用する。Nix devShell でビルドした成果物を
      # 安全に再利用するため、cache key には flake.lock を含め、rust-cache 自身の cargo/rustc 判定も
      # `nix develop -c` で実行して Nix shell 上の Rust 環境に合わせる。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-checks-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          cmd-format: nix develop -c {0}

      - name: static checks
        run: nix develop -c cargo xtask check static
