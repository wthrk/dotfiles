name: nightly update

# nightly に repo の flake.lock を bump し、更新履歴を記録して自動 PR を起票・auto-merge する。
#
# 設計（App 不要・GITHUB_TOKEN 完結）:
#   - PR 起票・auto-merge は GITHUB_TOKEN（`github.token`）で行う。別途 GitHub App を作って secret を仕込む
#     ことは要求しない（利用者仕様: bump は PR + copilot/codex 自動レビュー + セキュリティチェックで
#     マージまで自動、これは GITHUB_TOKEN で完結する）。
#   - bump は nixpkgs と brew tap 4 本のみ。framework input（nix-darwin / home-manager / nix-homebrew）は
#     bump しない（無人で framework を動かさない）。
#   - 生リリースノート取得 + LLM 抽出は prompt injection 隔離のため `contents: read` の別 job に分離する。
#     その job だけが `models: read` を持ち、GITHUB_TOKEN で GitHub Models を使う（別 secret 不要）。
#   - GITHUB_TOKEN が起票/push した PR では GitHub が `on: pull_request` の workflow（必須 check）を発火し
#     ない既知の制約がある。これを App 無しで満たすため、open-pr job が **同一 run 内で ①セキュリティチェック
#     `dotfiles ci verify-bump-lock`（信頼 ref = この nightly workflow の checkout = 自分自身のコードで実行）
#     と ②実 static checks `cargo xtask check static`（static-checks.yml と同一コマンドを bump 後 lock で実行）
#     の両方を走らせ、両方が合格した場合に限り** PR head commit に `static checks` という commit status を
#     GITHUB_TOKEN で POST する。適用済み「main」ruleset の required context `static checks` は context 名で
#     突合するため、この Actions 由来 status が required check を満たす。①の検査主体は信頼 ref のコードで、
#     検査対象は base..head の lock 差分（git データ）であり、PR 作業ツリーの dotfiles を検査主体にしない。
#     ②は bot PR では他に誰も走らせない実 static checks（`nix flake check` 含む）で、bump で config が eval
#     失敗していないかを auto-merge 前に検知する真のゲートになる。いずれか失敗すれば status を投稿しない
#     （required check 未充足 → auto-merge されない・fail-closed）。
#   - その後 `@codex review` コメントを投稿（codex 自動レビュー）し、Copilot は GitHub 側のネイティブ
#     code review で走る。`gh pr merge --auto --squash` で auto-merge を有効化し、copilot レビュー充足 +
#     required status（`static checks`）満了でマージされる。
#
# 残留制約（実 GitHub でしか最終確認できない。マージ後に workflow_dispatch dry_run=false で検証する）:
#   - GITHUB_TOKEN で POST した commit status `static checks` が、適用済み ruleset の required context と
#     確実に名前突合してマージ条件を満たすか。
#   - `gh pr merge --auto` を GITHUB_TOKEN 権限（pull-requests: write）で有効化できるか（repo 設定で
#     auto-merge が有効である必要がある）。
#   - copilot_code_review が bot/GITHUB_TOKEN 起票 PR で発火するか。
#   いずれも未充足ならマージは保留され（無人で main に入らない）、人手レビュー経路へ送られる。
#
# インライン verify-bump-lock の適用範囲（threat-model。App 廃止に伴い nightly-bump-guard.yml を削除した結果）:
#   - インライン verify-bump-lock は **nightly workflow が自分で起票する bump PR にのみ適用**される（この
#     open-pr job が同一 run 内で実行するため）。第三者が nightly/bump-* prefix で**直接起票した PR には
#     verify-bump-lock は走らない**（全 PR を横断検査していた required check の nightly-bump-guard.yml は削除済み）。
#   - そうした攻撃者起票 PR のマージ阻止は、bypass 不能な「main」ruleset の必須 `static checks` と Copilot/Codex
#     の自動レビューに依存する（加えて `.github/**` 改変はそもそも許可パス外として弾かれる）。
#   - より強い保護が必要なら、App 不要の per-PR guard workflow（on: pull_request で nightly-prefix PR に
#     verify-bump-lock を実行し「main」ruleset の required check に加える）を別途有効化できる。本仕様は
#     App/secret 不要を維持するため、この per-PR guard は既定で有効化しない。
#
# dry_run（workflow_dispatch 既定 true）では bump と record と diff までを実行し、PR 起票・push を行わない。
# 実発火（schedule）前に dry_run で old/new eval（ビルド非実行・数秒）と TOML 生成を検証する運用を前提とする。

on:
  schedule:
    # 18:00 UTC（plan 例）。マージ後の朝に各マシンが追随する想定。
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら PR 起票・push をせず bump/record/diff のみ検証する"
        type: boolean
        default: true
  # TEMPORARY（CI 実挙動検証用・マージ前に削除）: default branch に未配置で workflow_dispatch が
  # 使えないため、PR 同期で bump/record/diff を実走させて挙動を確認する。open-pr job は
  # `github.event_name == 'schedule' || inputs.dry_run == 'false'` でガードされ pull_request では skip される。
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CI_REFERENCE: darwinConfigurations.ci-ref

jobs:
  # 1) lock を bump し、bump 前後の宣言パッケージ版を eval（ビルド不要）して artifact に渡す。
  #    LLM や PR 起票の権限を持たせない（contents: read のみ）。
  #
  #    eval ベース化（closure ビルド全廃）: nightly が必要とするのは「どの宣言パッケージが old→new で版変化
  #    したか」だけで、それは `pname`/`version`（評価時属性）を `nix eval --json` で数秒で取れる。フル closure
  #    （~12GiB、GUI アプリ + Rust クレートのソースビルド）を `nix store diff-closures` のため old/new 2 回
  #    ビルドしていたのが ①~80 分 ②macos runner のディスク枯渇（No space left on device）③キャッシュ追加でも
  #    peak ディスク悪化、と破綻していた。eval はビルド/フェッチを伴わずディスク無関係のため、ディスク解放
  #    ステップと /nix/store の GHA キャッシュ（cache-nix-action）は不要になり削除した。
  bump:
    name: bump lock and eval declared versions
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      nixpkgs_old: ${{ steps.revs.outputs.nixpkgs_old }}
      nixpkgs_new: ${{ steps.revs.outputs.nixpkgs_new }}
      cask_rev_old: ${{ steps.revs.outputs.cask_rev_old }}
      cask_rev_new: ${{ steps.revs.outputs.cask_rev_new }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # /nix/store を run 間でキャッシュする（GHA cache backend・GITHUB_TOKEN のみ・外部 secret 不要）。
      # eval ベース化で ~12GiB のフル darwin closure ビルドは消えており、この job が実際に取得するのは
      # eval 用の nixpkgs 等の小さい依存だけのため、保存物は GHA 上限内に収まる。restore/save の失敗や
      # miss はビルドを遅くするだけで fail させない（fail-on 既定 = 空 = fail-safe）。
      - name: /nix/store をキャッシュ
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust/dotfiles-cli/Cargo.toml', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size: 3G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # ci-ref の宣言パッケージ（home.packages + environment.systemPackages）の name→version を eval する。
      # `--apply` で `pname`/`version`（無ければ `parseDrvName` / 空 version 許容）を name→version object に
      # 畳む。ビルド/フェッチは一切走らず数秒で完了する。home / system 両 attrset を jq で 1 マップへ統合する
      # （system 側に同名があれば system を優先。実フリートでは重複は基本起きない）。
      - name: bump 前の宣言パッケージ版を eval
        id: old
        run: |
          set -euo pipefail
          ./.github/scripts/eval-declared-versions.sh "$CI_REFERENCE" nix-old.json
          nixpkgs_old="$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"
          echo "nixpkgs_old=$nixpkgs_old" >> "$GITHUB_OUTPUT"
          # brew cask 版差分のため、bump 前の cask tap rev も記録する。
          cask_rev_old="$(jq -r '.nodes["homebrew-homebrew-cask"].locked.rev' flake.lock)"
          echo "cask_rev_old=$cask_rev_old" >> "$GITHUB_OUTPUT"

      - name: nixpkgs と tap input を bump
        run: |
          set -euo pipefail
          # framework input（nix-darwin / home-manager / nix-homebrew）は bump しない。
          nix flake update \
            nixpkgs \
            homebrew-homebrew-core \
            homebrew-homebrew-cask \
            homebrew-azure-bicep \
            homebrew-hashicorp-tap

      - name: bump 後の宣言パッケージ版を eval
        id: new
        run: |
          set -euo pipefail
          ./.github/scripts/eval-declared-versions.sh "$CI_REFERENCE" nix-new.json

      - name: rev を集約
        id: revs
        run: |
          set -euo pipefail
          echo "nixpkgs_old=${{ steps.old.outputs.nixpkgs_old }}" >> "$GITHUB_OUTPUT"
          nixpkgs_new="$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"
          echo "nixpkgs_new=$nixpkgs_new" >> "$GITHUB_OUTPUT"
          echo "cask_rev_old=${{ steps.old.outputs.cask_rev_old }}" >> "$GITHUB_OUTPUT"
          cask_rev_new="$(jq -r '.nodes["homebrew-homebrew-cask"].locked.rev' flake.lock)"
          echo "cask_rev_new=$cask_rev_new" >> "$GITHUB_OUTPUT"

      - name: bump 済み lock と eval 版マップを artifact 化
        uses: actions/upload-artifact@v4
        with:
          name: bump-state
          retention-days: 1
          include-hidden-files: true
          path: |
            flake.lock
            nix-old.json
            nix-new.json
          if-no-files-found: error

  # 2) 生ノート取得 + LLM 抽出 + record。prompt injection を隔離するため contents: read のみで、
  #    GitHub Models を使う models: read をこの job にだけ与える。出力は更新履歴 TOML（信頼境界内の機械
  #    バリデート済み）として artifact に渡す。
  record:
    name: extract notes and record history
    needs: bump
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      models: read
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # /nix/store を run 間でキャッシュする（bump job と同設計）。record は `.#default`（dotfiles-cli の
      # 小さな Rust crate）を build し eval 依存を取得するだけのため保存物は小さく、GHA 上限内に収まる。
      # miss/失敗は遅くなるだけで fail させない（fail-safe）。
      - name: /nix/store をキャッシュ
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust/dotfiles-cli/Cargo.toml', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size: 3G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # bump job が eval した old/new 版マップ（nix-old.json / nix-new.json）と bump 後 lock を取得する。
      # eval ベース化により record 側で closure を build する必要は無く、版差分は eval JSON から得る。
      # download-artifact は bump 後 flake.lock を作業ツリーに展開するが、record はそれを参照しない
      # （nix 版差分は eval JSON、brew 版差分は tap rev の cask ファイルから決定論的に算出する）。
      - name: bump 済み lock と eval 版マップを取得
        uses: actions/download-artifact@v4
        with:
          name: bump-state

      # 宣言 cask の版差分を old/new cask tap rev から決定論的に算出する（fix3）。ライブ brew 問い合わせは
      # せず、各 cask の `version` を tap rev の cask ファイルから読み、`name<TAB>old<TAB>new` の差分ファイルへ
      # 書く。これが record の `--brew-diff` 入力になり、brew 版差分が空縮退せず実取得される。取得できない
      # cask（letter subdir 解決失敗・404 等）はその cask 行を出さず、brew 差分は部分的になる（縮退は明示）。
      - name: brew cask 版差分を算出
        id: brew
        env:
          CASK_REV_OLD: ${{ needs.bump.outputs.cask_rev_old }}
          CASK_REV_NEW: ${{ needs.bump.outputs.cask_rev_new }}
          # gh は GH_TOKEN を env から読む。token は argv に乗せない。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          diff_file="$RUNNER_TEMP/brew-diff.tsv"
          : > "$diff_file"
          # 宣言 cask 名を homebrew.nix の casks 配列から抽出（"name" 行）。
          casks="$(sed -n '/casks = \[/,/\];/p' nix/modules/homebrew.nix \
            | grep -oE '"[^"]+"' | tr -d '"')"
          cask_version() {
            # $1=rev $2=cask 名。cask tap の Casks/<subdir>/<name>.rb から version "..." を読む。
            # subdir は通常 name 先頭 1 文字（letter）だが、font cask（font- 始まり）は letter でなく固定
            # `font` サブディレクトリ（Casks/font/<name>.rb）に置かれるため subdir を font にする（さもなくば
            # Casks/f/font-*.rb は 404 になり差分が空縮退する）。
            local rev="$1" name="$2" subdir
            case "$name" in
              font-*) subdir="font" ;;
              *) subdir="$(printf '%s' "$name" | cut -c1)" ;;
            esac
            gh api "repos/homebrew/homebrew-cask/contents/Casks/${subdir}/${name}.rb?ref=${rev}" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null \
              | grep -oE 'version "[^"]+"' | head -n1 | sed -E 's/version "([^"]+)"/\1/' || true
          }
          for name in $casks; do
            old_v="$(cask_version "$CASK_REV_OLD" "$name")"
            new_v="$(cask_version "$CASK_REV_NEW" "$name")"
            # 両 rev とも取得できないものは差分対象にしない（縮退）。
            [ -z "$old_v" ] && [ -z "$new_v" ] && continue
            # 版変更なし（old==new）の cask は更新ではないため diff へ出さない（F5 ノイズ抑制）。
            # adapter 側でも落とすが、差分ファイル段階で除外して空 record/no-op エントリを根元から防ぐ。
            [ "$old_v" = "$new_v" ] && continue
            printf '%s\t%s\t%s\n' "$name" "${old_v:-∅}" "${new_v:-∅}" >> "$diff_file"
          done
          echo "diff_file=$diff_file" >> "$GITHUB_OUTPUT"

      - name: eval 版差分から record
        env:
          NIXPKGS_OLD: ${{ needs.bump.outputs.nixpkgs_old }}
          NIXPKGS_NEW: ${{ needs.bump.outputs.nixpkgs_new }}
          CASK_REV_NEW: ${{ needs.bump.outputs.cask_rev_new }}
          BREW_DIFF: ${{ steps.brew.outputs.diff_file }}
          # GitHub Models は GITHUB_TOKEN で使う。別 secret は持たせない。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # nix 版差分は bump job が eval した old/new 版マップ（nix-old.json / nix-new.json）から得る。closure は
          # 一切 build しない（eval ベース化）。record の nix adapter が 2 マップを domain の diff_versions で比較し、
          # 版変化した宣言パッケージだけを差分にする（old==new は除外）。`nix develop` は dotfiles バイナリの
          # build だけに使う（小さい）。
          at="$(date -u +%FT%TZ)"
          out="docs/update-history/$(date -u +%Y-%m).toml"
          # ノート取得元レジストリ（provenance の学習・再利用）。checkout した repo の既存レジストリを参照して
          # 再利用し（再探索しない＝GitHub Models レート逓減）、新規/未知/自己修復の取得元だけを追記する。
          # docs/update-history/** 配下に置くため nightly の commit 許可パス内に収まり、レジストリも同経路で
          # repo に入る。記録経路は origin（mechanical/ai-discovered/none）別の決定論ソートで diff を最小化する。
          notes_sources="docs/update-history/notes-sources.toml"
          mkdir -p docs/update-history
          # brew-notes-base: new cask tap rev の Casks 配下を基底にし、record adapter が
          # `<base><letter>/<name>.rb` で cask 定義（homepage/url を含む）を取得する。これは **brew tap 由来**
          # package にだけ適用され、nix eval 由来 package には使われない（出所別 base 振り分け）。letter
          # subdir を解決できない cask は 404 となり、その cask は version+notes_url 縮退（graceful degradation）に
          # なる。許可ホスト https のみ取得する。nix package のノート取得先は eval JSON（nix-old/new.json）が
          # package ごとに運ぶ notes_source（meta.changelog、無ければ meta.homepage）で per-package に解決され、
          # この base 引数は brew 専用。notes_source が無い/許可ホスト外/取得不能な nix package は version+notes_url
          # へ縮退する（許可ホスト https のみ取得）。
          brew_notes_base="https://raw.githubusercontent.com/homebrew/homebrew-cask/${CASK_REV_NEW}/Casks/"
          # dotfiles バイナリは devShell に含まれないため、公開パッケージ `.#default`（= dotfiles-cli、
          # bin 名 dotfiles）をビルドして実行する。dotfiles-cli は小さな Rust crate で重い closure は引かない。
          dotfiles_bin="$(nix build --no-link --print-out-paths .#default)/bin/dotfiles"
          "$dotfiles_bin" update-history record \
            --nix-old nix-old.json \
            --nix-new nix-new.json \
            --old-rev "$NIXPKGS_OLD" \
            --new-rev "$NIXPKGS_NEW" \
            --nixpkgs-old "$NIXPKGS_OLD" \
            --nixpkgs-new "$NIXPKGS_NEW" \
            --reference "$CI_REFERENCE" \
            --at "$at" \
            --brew-diff "$BREW_DIFF" \
            --brew-notes-base "$brew_notes_base" \
            --notes-sources "$notes_sources" \
            --out "$out"

      - name: 履歴 TOML を artifact 化
        uses: actions/upload-artifact@v4
        with:
          name: history-record
          retention-days: 1
          path: |
            docs/update-history/
          if-no-files-found: error

  # 3) PR 起票 + インラインセキュリティチェック + 実 static checks + status 投稿 + auto-merge。
  #    GITHUB_TOKEN で完結する（GitHub App / secret は使わない）。GITHUB_TOKEN 起票 PR では
  #    `on: pull_request` の必須 check（static-checks.yml）が発火しないため、この job が同一 run 内で
  #    ①`dotfiles ci verify-bump-lock`（lock 差分のセキュリティ検査）と ②`cargo xtask check static`
  #    （static-checks.yml と同一の実 static checks）を bump 後 lock で実行し、**両方が合格した場合に
  #    限り** PR head に `static checks` の commit status を success で POST して required check を満たす。
  #    どちらか失敗なら step 失敗で job が止まり、status 投稿（後続 step）に到達しない（fail-closed）。
  #
  #    runs-on は ubuntu-latest（static-checks.yml と同条件）。`cargo xtask check static` は
  #    `nix flake check --all-systems` を含み darwinConfigurations を eval するが、非 darwin runner では
  #    `.system` 派生はビルドされない（eval のみ・~11 分・重い closure ビルド無し）。verify-bump-lock 用
  #    `dotfiles` バイナリの build（小さい）と合わせても重い closure は発生しない。
  open-pr:
    name: open bump PR and enable auto-merge
    needs: [bump, record]
    if: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # GITHUB_TOKEN に必要な最小権限のみ付与する。App secret は使わない。
    #   contents: write       … bump ブランチを push する。
    #   pull-requests: write  … PR を起票し auto-merge を有効化する。
    #   statuses: write       … PR head に `static checks` commit status を POST して required check を満たす。
    #   checks: write         … （将来 check run を使う場合の余地。status 投稿は statuses で足りる。）
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: write
    steps:
      # この nightly workflow 自身の ref を checkout する。これは信頼 ref（schedule なら既定ブランチ、
      # workflow_dispatch なら起動 ref）であり、ここでビルドする `dotfiles` バイナリ（verify-bump-lock の
      # 判定主体）も信頼コードである。後段でこのツリーに bump を commit し、base..head の lock 差分（git
      # データ）を検査対象にする。判定主体（信頼 ref のコード）と検査対象（git の lock 差分）は分離される。
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # /nix/store を run 間でキャッシュする（bump/record と同設計）。open-pr は `.#default`（verify-bump-lock
      # 用 dotfiles バイナリ・小さい）の build と `cargo xtask check static`（`nix flake check` の eval + toolchain
      # 取得）を行うため、その /nix/store 取得物をキャッシュして高速化する。restore は checkout した base ツリーの
      # flake.lock を鍵にする（artifact の bump 後 lock 展開より前に走る）。miss/失敗は遅くなるだけで fail させない。
      - name: /nix/store をキャッシュ
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust/dotfiles-cli/Cargo.toml', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size: 3G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # cargo build キャッシュ（~/.cargo + target/）を再利用する。open-pr は `.#default` の build と
      # `cargo xtask check static`（workspace コンパイル）を行うため target/ の再ビルド回避が効く。static-checks.yml
      # と同一コマンド・同一 OS（ubuntu）のため shared-key を共有して両 workflow 間で target/ を温める。fail-safe。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-checks-${{ runner.os }}

      - name: bump 済み lock を取得
        uses: actions/download-artifact@v4
        with:
          name: bump-state

      - name: 履歴 TOML を取得
        uses: actions/download-artifact@v4
        with:
          name: history-record
          path: docs/update-history

      - name: bump ブランチを作成して commit
        id: commit
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          branch="nightly/bump-$(date -u +%Y%m%d%H%M%S)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock docs/update-history
          if git diff --cached --quiet; then
            echo "no changes to propose"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(deps): nightly flake.lock bump と更新履歴記録"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      # セキュリティチェック本体をインライン実行する。判定主体は信頼 ref の dotfiles（このツリーで build）、
      # 検査対象は base..head の commit パス union と両端 flake.lock 差分。許可外パス混入・許可外 input rev
      # 変更・空 bump があれば非 0 終了し、後続の static checks・status 投稿・PR 起票・merge を行わない
      # （fail-closed。step 失敗で job が止まり後続 step に到達しない）。
      - name: セキュリティチェック（verify-bump-lock）をインライン実行
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        run: |
          set -euo pipefail
          # 判定主体の dotfiles は devShell に無いため、checkout した信頼 ref の flake から `.#default`
          # （= dotfiles-cli、bin 名 dotfiles）をビルドして実行する。`.#default` は信頼 ref の flake から
          # ビルドされるため、検査主体（信頼 ref のコード）と検査対象（base..head の lock 差分）の分離は保たれる。
          dotfiles_bin="$(nix build --no-link --print-out-paths .#default)/bin/dotfiles"
          "$dotfiles_bin" ci verify-bump-lock \
            --base "${{ steps.commit.outputs.base_sha }}" \
            --head "${{ steps.commit.outputs.head_sha }}" \
            --repo .

      # 実 static checks を bump 後 lock で実行する。これは static-checks.yml と同一コマンドで、
      # GITHUB_TOKEN 起票 bot PR では他に誰も走らせないため重複でなく必須。`nix flake check --all-systems`
      # を含み、bump で config が eval 失敗していないか（例: upstream 削除されたパッケージ参照）を
      # auto-merge 前に検知する真のゲートになる。失敗すれば step 失敗で job が止まり、後続の status 投稿に
      # 到達しないため required check `static checks` は未充足のまま（success 詐称しない・fail-closed）。
      # ubuntu-latest 上では darwinConfigurations は eval されるが `.system` はビルドされない
      # （static-checks.yml と同条件・重い closure ビルド無し）。
      - name: 実 static checks（cargo xtask check static）を bump 後 lock で実行
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        run: |
          set -euo pipefail
          nix develop -c cargo xtask check static

      - name: bump ブランチを push して PR 起票
        id: pr
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        env:
          # GITHUB_TOKEN を gh に env 経由で渡す（argv に乗せずログ非混入）。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push origin "${{ steps.commit.outputs.branch }}"
          pr_url="$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "chore(deps): nightly flake.lock bump" \
            --body "nightly 自動 bump。nixpkgs と brew tap input の rev を更新し、更新履歴を記録します。同一 run で \`dotfiles ci verify-bump-lock\` と実 \`cargo xtask check static\`（static-checks.yml と同一）の両方が合格した場合のみ \`static checks\` status が投稿されます。Copilot/Codex の自動レビュー充足後に auto-merge されます。")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 起票 PR では `on: pull_request` の static-checks.yml が発火しないため、同一 run で
      # 実行した ①verify-bump-lock と ②実 static checks の**両方が合格した場合に限り** PR head へ
      # `static checks` commit status を success で POST して required check を満たす。両 step は本 step の
      # 前段にあり、いずれか失敗すれば job が止まり本 step に到達しない（success 詐称しない）。`if: success()`
      # を併用し、前段 step がすべて成功した場合のみ投稿することを明示的に保証する。context 名は適用済み
      # ruleset の required context（static-checks.yml の job 名 `static checks`）と一致させる。
      - name: required check `static checks` status を投稿
        if: ${{ success() && steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="static checks" \
            -f target_url="${RUN_URL}" \
            -f description="nightly-update run の verify-bump-lock + 実 static checks 合格"

      # codex 自動レビューを起動する（Copilot は GitHub 側のネイティブ code review で走る）。
      - name: codex レビューを依頼
        if: ${{ steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment "${{ steps.pr.outputs.pr_url }}" --body "@codex review"

      - name: auto-merge を有効化
        if: ${{ steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "${{ steps.pr.outputs.pr_url }}"
