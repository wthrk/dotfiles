name: nightly update

# nightly に repo の flake.lock を bump し、更新履歴（版差分＋概要）を記録して自動 PR を起票・auto-merge する。
#
# 設計（単純版・App 不要・GITHUB_TOKEN + OPEN_AI_API_KEY 完結）:
#   - bump は nixpkgs と brew tap 4 本のみ。framework input（nix-darwin / home-manager / nix-homebrew）は
#     bump しない（無人で framework を動かさない）。
#   - 概要（change_items）の LLM 抽出は OpenAI API を使う。record job に **secret
#     `OPEN_AI_API_KEY`** を `env` で結線し、CLI（async-openai crate）が env から読む。GitHub Models /
#     `permissions: models: read` / GITHUB_TOKEN の LLM 用途は撤去した（PR 起票等の GITHUB_TOKEN は残す）。
#   - record は 1 回で全変更パッケージを要約しきる。ノートが取れないものは version-only（version + notes_url のみ）
#     としてその場で確定記録する（夜をまたいで埋める backfill は持たない）。
#   - PR 起票・auto-merge は GITHUB_TOKEN で行う（GitHub App / 別 secret は追加しない）。GITHUB_TOKEN 起票 PR
#     では `on: pull_request` の必須 check（static-checks.yml）が発火しないため、open-pr job が同一 run 内で
#     ①`dotfiles ci verify-bump-lock`（base..head の許可パス + lock 差分のセキュリティ検査）と ②実
#     `cargo xtask check static`（static-checks.yml と同一）の両方が合格した場合に限り、PR head へ
#     `static checks` commit status を success で POST して required check を満たす（fail-closed）。
#
# guard（最小限）:
#   - open-pr（非 dry-run・PR 起票/status 投稿経路）は **既定ブランチ起動に限定**する。schedule は GitHub の
#     制約上常に既定ブランチで発火するため許可し、workflow_dispatch は dry_run=false かつ起動 ref が既定
#     ブランチのときだけ許可する（job-level `if` + 先頭の明示ガード step で fail-closed を二重化）。これは
#     信頼できない ref から検査主体（guard バイナリと static check）をビルドして status を詐称投稿する経路を塞ぐ。
#   - 許可パス（flake.lock + docs/update-history/**）の強制は `dotfiles ci verify-bump-lock` が base..head の
#     commit パス union を検査して担う。許可外パス混入・許可外 input rev 変更・空 bump があれば非 0 終了し、
#     後続の static checks・status 投稿・PR 起票・merge へ進まない（無人 auto-merge が許可外を入れない最低限）。
#
# dry_run（workflow_dispatch 既定 true）では bump と record と diff までを実行し、PR 起票・push を
# 行わない。実発火（schedule）前に dry_run で old/new eval（ビルド非実行・数秒）と TOML 生成を検証する。
#
# 無更新の夜は record が TOML を書かず、open-pr の `git add` が差分無し→`has_changes=false` で PR を起票せず
# clean no-op になる。

on:
  schedule:
    # 18:00 UTC。マージ後の朝に各マシンが追随する想定。
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら PR 起票・push をせず bump/record/diff のみ検証する"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CI_REFERENCE: darwinConfigurations.ci-ref

jobs:
  # 1) lock を bump し、bump 前後の宣言パッケージ版を eval（ビルド不要）して artifact に渡す。
  #    LLM や PR 起票の権限を持たせない（contents: read のみ）。eval は `pname`/`version` を `nix eval --json`
  #    で数秒で取れるため、フル closure ビルドもディスク解放も /nix/store キャッシュも不要。
  bump:
    name: bump lock and eval declared versions
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      nixpkgs_old: ${{ steps.revs.outputs.nixpkgs_old }}
      nixpkgs_new: ${{ steps.revs.outputs.nixpkgs_new }}
      cask_rev_old: ${{ steps.revs.outputs.cask_rev_old }}
      cask_rev_new: ${{ steps.revs.outputs.cask_rev_new }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # ci-ref の宣言パッケージ（home.packages + environment.systemPackages）の name→version を eval する。
      # ビルド/フェッチは一切走らず数秒で完了する。
      - name: bump 前の宣言パッケージ版を eval
        id: old
        run: |
          set -euo pipefail
          ./.github/scripts/eval-declared-versions.sh "$CI_REFERENCE" nix-old.json
          nixpkgs_old="$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"
          echo "nixpkgs_old=$nixpkgs_old" >> "$GITHUB_OUTPUT"
          cask_rev_old="$(jq -r '.nodes["homebrew-homebrew-cask"].locked.rev' flake.lock)"
          echo "cask_rev_old=$cask_rev_old" >> "$GITHUB_OUTPUT"

      - name: nixpkgs と tap input を bump
        run: |
          set -euo pipefail
          # framework input（nix-darwin / home-manager / nix-homebrew）は bump しない。
          nix flake update \
            nixpkgs \
            homebrew-homebrew-core \
            homebrew-homebrew-cask \
            homebrew-azure-bicep \
            homebrew-hashicorp-tap

      - name: bump 後の宣言パッケージ版を eval
        id: new
        run: |
          set -euo pipefail
          ./.github/scripts/eval-declared-versions.sh "$CI_REFERENCE" nix-new.json

      - name: rev を集約
        id: revs
        run: |
          set -euo pipefail
          echo "nixpkgs_old=${{ steps.old.outputs.nixpkgs_old }}" >> "$GITHUB_OUTPUT"
          nixpkgs_new="$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"
          echo "nixpkgs_new=$nixpkgs_new" >> "$GITHUB_OUTPUT"
          echo "cask_rev_old=${{ steps.old.outputs.cask_rev_old }}" >> "$GITHUB_OUTPUT"
          cask_rev_new="$(jq -r '.nodes["homebrew-homebrew-cask"].locked.rev' flake.lock)"
          echo "cask_rev_new=$cask_rev_new" >> "$GITHUB_OUTPUT"

      - name: bump 済み lock と eval 版マップを artifact 化
        uses: actions/upload-artifact@v4
        with:
          name: bump-state
          retention-days: 1
          include-hidden-files: true
          path: |
            flake.lock
            nix-old.json
            nix-new.json
          if-no-files-found: error

  # 2) brew 版差分算出 → record（版差分＋概要を 1 回で完結）。
  #    概要の LLM 抽出は OpenAI API を使う。secret `OPEN_AI_API_KEY` を record step に env で結線し、
  #    CLI（async-openai crate）が env から読む。GitHub Models（models: read / GITHUB_TOKEN の LLM 用途）は使わない。
  #    出力は更新履歴 TOML（機械バリデート済み）として artifact に渡す。
  record:
    name: extract notes and record history
    needs: bump
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: bump 済み lock と eval 版マップを取得
        uses: actions/download-artifact@v4
        with:
          name: bump-state

      # 宣言 cask の版差分を old/new cask tap rev から決定論的に算出する（ライブ brew 問い合わせはしない）。
      # 各 cask の `version` を tap rev の cask ファイルから読み、`name<TAB>old<TAB>new` の差分ファイルへ書く。
      # 自己更新 cask（`auto_updates true`）は `brew upgrade` が無人 upgrade しないため差分から除外する。
      - name: brew cask 版差分を算出
        id: brew
        env:
          CASK_REV_OLD: ${{ needs.bump.outputs.cask_rev_old }}
          CASK_REV_NEW: ${{ needs.bump.outputs.cask_rev_new }}
          # gh は GH_TOKEN を env から読む。token は argv に乗せない。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          diff_file="$RUNNER_TEMP/brew-diff.tsv"
          : > "$diff_file"
          casks="$(sed -n '/casks = \[/,/\];/p' nix/modules/homebrew.nix \
            | grep -oE '"[^"]+"' | tr -d '"')"
          # 自己更新 cask（homebrew.nix の `auto_updates true`）を版差分から除外する。ここを変える場合は
          # homebrew.nix の onActivation コメントと同期させること。
          auto_update_casks="bitwarden codex-app ghostty"
          is_auto_update_cask() {
            case " $auto_update_casks " in
              *" $1 "*) return 0 ;;
              *) return 1 ;;
            esac
          }
          cask_version() {
            # $1=rev $2=cask 名。cask tap の Casks/<subdir>/<name>.rb から version "..." を読む。
            # font cask は letter でなく固定 `font` サブディレクトリに置かれる。
            local rev="$1" name="$2" subdir
            case "$name" in
              font-*) subdir="font" ;;
              *) subdir="$(printf '%s' "$name" | cut -c1)" ;;
            esac
            gh api "repos/homebrew/homebrew-cask/contents/Casks/${subdir}/${name}.rb?ref=${rev}" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null \
              | grep -oE 'version "[^"]+"' | head -n1 | sed -E 's/version "([^"]+)"/\1/' || true
          }
          for name in $casks; do
            if is_auto_update_cask "$name"; then
              continue
            fi
            old_v="$(cask_version "$CASK_REV_OLD" "$name")"
            new_v="$(cask_version "$CASK_REV_NEW" "$name")"
            # 両 rev とも取得できない / 版変更なしの cask は差分対象にしない（縮退・ノイズ抑制）。
            [ -z "$old_v" ] && [ -z "$new_v" ] && continue
            [ "$old_v" = "$new_v" ] && continue
            printf '%s\t%s\t%s\n' "$name" "${old_v:-∅}" "${new_v:-∅}" >> "$diff_file"
          done
          echo "diff_file=$diff_file" >> "$GITHUB_OUTPUT"

      # eval 版差分から record（版差分＋概要を 1 回で完結）。概要の LLM 抽出は OpenAI API（async-openai crate）で
      # 行い、API キーは secret `OPEN_AI_API_KEY` を env で渡す（CLI が env から読み、argv / ログに出さない）。
      # ノートが取れないものは version-only（version + notes_url のみ）としてその場で確定記録する。
      - name: eval 版差分から record
        env:
          NIXPKGS_OLD: ${{ needs.bump.outputs.nixpkgs_old }}
          NIXPKGS_NEW: ${{ needs.bump.outputs.nixpkgs_new }}
          CASK_REV_NEW: ${{ needs.bump.outputs.cask_rev_new }}
          BREW_DIFF: ${{ steps.brew.outputs.diff_file }}
          # nix パッケージのリリースノートを GitHub Releases API から取得する際の認証用 token（未認証 60 req/hr →
          # 認証 5000 req/hr）。notes.rs::github_token() が env GITHUB_TOKEN を読む。LLM 用途ではないため
          # permissions: models: read は不要（contents: read で public release 取得に十分）。
          GITHUB_TOKEN: ${{ github.token }}
          # 概要抽出の OpenAI API キー（利用者が設定済みの secret。この厳密名で CLI が env から読む）。
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
        run: |
          set -euo pipefail
          at="$(date -u +%FT%TZ)"
          out="docs/update-history/$(date -u +%Y-%m).toml"
          # ノート取得元レジストリ（provenance の学習・再利用）。既存レジストリを再利用し、新規/未知の取得元だけを追記する。
          notes_sources="docs/update-history/notes-sources.toml"
          mkdir -p docs/update-history
          brew_notes_base="https://raw.githubusercontent.com/homebrew/homebrew-cask/${CASK_REV_NEW}/Casks/"
          # dotfiles バイナリは devShell に含まれないため、公開パッケージ `.#default`（= dotfiles-cli）をビルドして実行する。
          dotfiles_bin="$(nix build --no-link --print-out-paths .#default)/bin/dotfiles"
          "$dotfiles_bin" update-history record \
            --nix-old nix-old.json \
            --nix-new nix-new.json \
            --old-rev "$NIXPKGS_OLD" \
            --new-rev "$NIXPKGS_NEW" \
            --nixpkgs-old "$NIXPKGS_OLD" \
            --nixpkgs-new "$NIXPKGS_NEW" \
            --reference "$CI_REFERENCE" \
            --at "$at" \
            --brew-diff "$BREW_DIFF" \
            --brew-notes-base "$brew_notes_base" \
            --notes-sources "$notes_sources" \
            --out "$out"

      # 無更新の夜は record が TOML を書かず、docs/update-history/ のアップロード対象が 0 件になりうる。
      # `if-no-files-found: error` だと無更新夜が失敗扱いになるため `warn` で安全側に倒す（clean no-op）。
      - name: 履歴 TOML を artifact 化
        uses: actions/upload-artifact@v4
        with:
          name: history-record
          retention-days: 1
          path: |
            docs/update-history/
          if-no-files-found: warn

  # 3) PR 起票 + インラインセキュリティチェック（verify-bump-lock）+ 実 static checks + status 投稿 + auto-merge。
  #    GITHUB_TOKEN で完結する（GitHub App / 別 secret は使わない）。GITHUB_TOKEN 起票 PR では
  #    `on: pull_request` の static-checks.yml が発火しないため、この job が同一 run 内で
  #    ①`dotfiles ci verify-bump-lock`（許可パス + lock 差分の検査）と ②`cargo xtask check static`
  #    （static-checks.yml と同一）の両方が合格した場合に限り `static checks` status を success で POST する。
  open-pr:
    name: open bump PR and enable auto-merge
    needs: [bump, record]
    # 非 dry-run（PR 起票・status 投稿経路）は既定ブランチ起動に限定する。schedule は常に既定ブランチで発火する
    # ため許可し、workflow_dispatch は dry_run=false かつ起動 ref が既定ブランチのときだけ許可する。これは信頼
    # できない ref から検査主体をビルドして `static checks` status を詐称投稿する経路を塞ぐ。
    if: >-
      ${{ github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
           github.event.inputs.dry_run == 'false' &&
           github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # 明示ガード（fail-closed の二重化）: 非既定 ref からの非 dry-run 起動を checkout 前に拒否する。job-level
      # `if` で既に skip される前提だが、評価差異で誤って到達しても信頼できない ref から検査主体をビルドする前に
      # ここで fail させる。schedule は既定ブランチ固定のため通過する。
      - name: 非既定 ref の非 dry-run を拒否（guard）
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            exit 0
          fi
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::非既定 ref ($REF_NAME) からの非 dry-run open-pr は拒否します（既定ブランチ $DEFAULT_BRANCH からのみ許可）。" >&2
            exit 1
          fi

      # この nightly workflow 自身の ref（信頼 ref = 上のガードと job-level `if` で既定ブランチ起動に限定済み）を
      # checkout する。ここでビルドする `dotfiles` バイナリ（verify-bump-lock の判定主体）も信頼コードである。
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # cargo build キャッシュ（~/.cargo + target/）を再利用する。`.#default` の build と `cargo xtask check static`
      # で target/ の再ビルド回避が効く。static-checks.yml と同一 OS（ubuntu）のため shared-key を共有する。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-checks-${{ runner.os }}

      - name: bump 済み lock を取得
        uses: actions/download-artifact@v4
        with:
          name: bump-state

      # 無更新の夜は record が history-record artifact を作らない。その場合 download が失敗するが、clean no-op に
      # するため失敗を許容する（continue-on-error）。artifact 不在なら docs/update-history は checkout 状態のままで、
      # 後段の `git add` が差分無し→`has_changes=false`→PR 起票せず no-op になる。
      - name: 履歴 TOML を取得
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: history-record
          path: docs/update-history

      - name: bump ブランチを作成して commit
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # 検査 base は実際の PR base（既定ブランチ）の SHA に揃える（checkout HEAD ではない）。
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          base_sha="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          branch="nightly/bump-$(date -u +%Y%m%d%H%M%S)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock docs/update-history
          if git diff --cached --quiet; then
            echo "no changes to propose"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(deps): nightly flake.lock bump と更新履歴記録"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      # セキュリティチェック本体。判定主体は信頼 ref の dotfiles（このツリーで build）、検査対象は base..head の
      # commit パス union と両端 flake.lock 差分。許可外パス混入・許可外 input rev 変更・空 bump があれば非 0
      # 終了し、後続の static checks・status 投稿・PR 起票・merge へ進まない（fail-closed）。
      - name: セキュリティチェック（verify-bump-lock）をインライン実行
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        run: |
          set -euo pipefail
          dotfiles_bin="$(nix build --no-link --print-out-paths .#default)/bin/dotfiles"
          "$dotfiles_bin" ci verify-bump-lock \
            --base "${{ steps.commit.outputs.base_sha }}" \
            --head "${{ steps.commit.outputs.head_sha }}" \
            --repo .

      # 実 static checks を bump 後 lock で実行する。static-checks.yml と同一コマンドで、GITHUB_TOKEN 起票 bot PR
      # では他に誰も走らせないため必須。`nix flake check --all-systems` を含み、bump で config が eval 失敗して
      # いないかを auto-merge 前に検知する真のゲートになる。失敗すれば step 失敗で job が止まり status 投稿へ
      # 到達しない（required check 未充足・fail-closed）。
      - name: 実 static checks（cargo xtask check static）を bump 後 lock で実行
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        run: |
          set -euo pipefail
          nix develop -c cargo xtask check static

      - name: bump ブランチを push して PR 起票
        id: pr
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push origin "${{ steps.commit.outputs.branch }}"
          pr_url="$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "chore(deps): nightly flake.lock bump" \
            --body "nightly 自動 bump。nixpkgs と brew tap input の rev を更新し、更新履歴（版差分＋概要）を記録します。同一 run で \`dotfiles ci verify-bump-lock\` と実 \`cargo xtask check static\`（static-checks.yml と同一）の両方が合格した場合のみ \`static checks\` status が投稿されます。Copilot/Codex の自動レビュー充足後に auto-merge されます。")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      # ①verify-bump-lock と ②実 static checks の両方が合格した場合に限り PR head へ `static checks` commit
      # status を success で POST して required check を満たす。両 step は前段にあり、いずれか失敗すれば job が
      # 止まり本 step に到達しない。`if: success()` を併用して前段成功を明示保証する。context 名は適用済み
      # ruleset の required context（static-checks.yml の job 名 `static checks`）と一致させる。
      - name: required check `static checks` status を投稿
        if: ${{ success() && steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="static checks" \
            -f target_url="${RUN_URL}" \
            -f description="nightly-update run の verify-bump-lock + 実 static checks 合格"

      # codex 自動レビューを起動する（Copilot は GitHub 側のネイティブ code review で走る）。
      - name: codex レビューを依頼
        if: ${{ steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment "${{ steps.pr.outputs.pr_url }}" --body "@codex review"

      - name: auto-merge を有効化
        if: ${{ steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "${{ steps.pr.outputs.pr_url }}"
