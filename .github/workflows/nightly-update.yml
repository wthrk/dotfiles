name: nightly update

# nightly に repo の flake.lock を bump し、更新履歴（版差分＋概要）を記録して自動 PR を起票・auto-merge する。
#
# 設計（単純版・App 不要・GITHUB_TOKEN + OPEN_AI_API_KEY 完結）:
#   - パイプラインのロジックは全て `dotfiles update-history`（Rust）が持つ。eval 整形・owner/repo 導出・nix 版
#     差分・brew cask 版差分（reqwest で cask `.rb` 取得・version 解析。`homebrew.nix` の `greedyCasks = true` に
#     合わせ `auto_updates true` の cask も追跡対象。`sha256 :no_check` の未固定成果物は fail-closed で停止）・
#     flake.lock rev 抽出は
#     Rust に集約し、workflow は避けられない nix tool 呼び出し（Rust が起動する `nix eval` / `nix flake update`）と
#     薄いオーケストレーション（checkout / install nix / bump / record 起動 / upload / PR）だけを行う。
#   - bump は nixpkgs と brew tap 4 本のみ。framework input（nix-darwin / home-manager / nix-homebrew）は
#     bump しない（無人で framework を動かさない）。
#   - 概要（change_items）の LLM 抽出の正本は OpenAI API。record step に **secret
#     `OPEN_AI_API_KEY`** を `env` で結線し、CLI（async-openai crate）が env から読む。GitHub Models /
#     `permissions: models: read` / GITHUB_TOKEN の LLM 用途は撤去した（PR 起票等の GITHUB_TOKEN は残す）。
#   - record は 1 回で全変更パッケージを要約しきる。ノートが取れないものは version-only（version + notes_url のみ）
#     としてその場で確定記録し、必要なら利用者向け `dotfiles update-history backfill-version-only` で既存の月次履歴を
#     後から再処理して埋め直せる。
#   - PR 起票・auto-merge は GITHUB_TOKEN で行う（GitHub App / 別 secret は追加しない）。GITHUB_TOKEN 起票 PR
#     では `on: pull_request` の必須 check（static-checks.yml）が発火しないため、open-pr job が同一 run 内で
#     ①`cargo xtask ci verify-bump-lock`（base..head の許可パス + lock 差分のセキュリティ検査）、②実
#     `cargo xtask check static`、③`nix build .#dotfiles-cli`（②③は static-checks.yml と同一）の全てが
#     合格した場合に限り、PR head へ `static checks` commit status を success で POST して required check を
#     満たす（fail-closed）。③の derivation は `doCheck = false` のため、検証範囲は buildPhase の
#     compile / link に現れる依存欠落までであり、checkPhase だけが起動する依存は含まない。
#
# guard（最小限）:
#   - open-pr（非 dry-run・PR 起票/status 投稿経路）は **既定ブランチ起動に限定**する。schedule は GitHub の
#     制約上常に既定ブランチで発火するため許可し、workflow_dispatch は dry_run=false かつ起動 ref が既定
#     ブランチのときだけ許可する（job-level `if` + 先頭の明示ガード step で fail-closed を二重化）。これは
#     信頼できない ref から検査主体（guard バイナリと static check）をビルドして status を詐称投稿する経路を塞ぐ。
#   - 許可パス（flake.lock + docs/update-history/**）の強制は `cargo xtask ci verify-bump-lock` が base..head の
#     commit パス union を検査して担う。許可外パス混入・許可外 input rev 変更・空 bump があれば非 0 終了し、
#     後続の static checks・status 投稿・PR 起票・merge へ進まない（無人 auto-merge が許可外を入れない最低限）。
#
# dry_run（workflow_dispatch 既定 true）では bump と record と diff までを実行し、PR 起票・push を
# 行わない。実発火（schedule）前に dry_run で old/new eval（ビルド非実行・数秒）と TOML 生成を検証する。
#
# 無更新の夜は record が TOML を書かず、open-pr の `git add` が差分無し→`has_changes=false` で PR を起票せず
# clean no-op になる。

on:
  schedule:
    # 18:00 UTC。マージ後の朝に各マシンが追随する想定。
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら PR 起票・push をせず bump/record/diff のみ検証する"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CI_REFERENCE: darwinConfigurations.ci-ref

jobs:
  # 1) bump 前の宣言パッケージ版を eval（Rust）し、lock を bump し、bump 後の版差分と概要を記録するまでを
  #    1 job で完結させる。判定主体の dotfiles バイナリは bump 前 devShell で 1 回だけビルドし、bump 前 eval と
  #    record の両方がそれを使う。bump と record を別 job に分けると同じバイナリを 2 回ビルドすることになり、
  #    macOS runner ではそれだけで 1 晩あたり 9 分規模の重複になる（分けても後段へ渡せるのは lock と JSON だけで、
  #    ビルド成果物は渡らない）。
  #    整形・owner/repo 導出・rev 抽出・nix/brew 版差分・概要抽出のロジックは全て `dotfiles update-history`（Rust）が
  #    持ち、ここは避けられない nix tool 呼び出し（Rust が起動する `nix eval` / `nix flake update`）と薄い
  #    オーケストレーションだけを行う。PR 起票の権限は持たせない（contents: read のみ）。
  bump:
    name: bump lock and record history
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      repo_base_sha: ${{ steps.old.outputs.repo_base_sha }}
      # record が当月 history TOML を書いた（= 更新ありで履歴 artifact が必要）かどうか。open-pr 側はこの値で
      # history-record download を fail-closed にするか（更新ありの夜）/ 失敗許容にするか（無更新の clean no-op）を
      # 分岐する。
      has_history: ${{ steps.record.outputs.has_history }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # `/nix/store` はキャッシュしない。static-checks.yml と同じ判断。macOS runner では復元だけで 1 時間近くを
      # 消費して job の timeout-minutes を食い潰し、bump 本体へ到達できなくなる。store path は cache.nixos.org
      # から substitute する。

      # この job のビルドは `nix flake update` より前、= checkout した flake.lock の devShell で走る。よって
      # キャッシュキーに flake.lock ハッシュを含めれば、restore する target/ の build script が参照する
      # `/nix/store` closure は必ず一致する（GC 済み path を踏む事故が起きない）。依存 427 crate の再ビルドが
      # 消えるのでここは target/ まで再利用する。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-bump-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          cmd-format: nix develop -c {0}
          cache-targets: true

      # 判定主体（eval/導出/rev 抽出/版差分/概要記録）を担う dotfiles バイナリを devShell 内 cargo でビルドする。
      # `nix eval` 起動・owner/repo 導出・flake.lock rev 抽出・brew cask 版解析は全てこのバイナリ（Rust）が行う。
      # devShell 内ビルドのため実行も `nix develop -c` 経由でランタイムライブラリ（gpgme/libgit2/libssh2/openssl/
      # zlib 等）を供給する。
      #
      # このビルドと直後の bump 前 eval は `nix flake update` より前で完結させる。後ろへ移すとバイナリは
      # bump 後 devShell でビルドされ、bump 前 lock の snapshot（`cp flake.lock old-flake.lock`）と bump 前
      # 版の eval も bump 後 lock を見ることになり、版差分の基準が消える。下の record も同じバイナリを
      # `--reference-lock-file old-flake.lock` で bump 前 closure に固定して実行する。
      - name: dotfiles バイナリをビルド
        id: build
        run: |
          set -euo pipefail
          nix develop -c cargo build -p dotfiles-cli
          echo "bin=$PWD/target/debug/dotfiles" >> "$GITHUB_OUTPUT"

      # bump 前の宣言パッケージ版を Rust が `nix eval`（生の評価値）して owner/repo 導出まで行い JSON へ書く。
      - name: bump 前の宣言パッケージ版を eval と rev 抽出
        id: old
        env:
          DOTFILES_BIN: ${{ steps.build.outputs.bin }}
        run: |
          set -euo pipefail
          cp flake.lock old-flake.lock
          nix develop -c "$DOTFILES_BIN" update-history eval-versions --reference "$CI_REFERENCE" --out nix-old.json
          echo "repo_base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          nixpkgs_old="$("$DOTFILES_BIN" update-history lock-rev --lock flake.lock --node nixpkgs)"
          echo "nixpkgs_old=$nixpkgs_old" >> "$GITHUB_OUTPUT"
          cask_rev_old="$("$DOTFILES_BIN" update-history lock-rev --lock flake.lock --node homebrew-homebrew-cask)"
          echo "cask_rev_old=$cask_rev_old" >> "$GITHUB_OUTPUT"

      - name: nixpkgs と tap input を bump
        run: |
          set -euo pipefail
          # framework input（nix-darwin / home-manager / nix-homebrew）は bump しない。
          nix flake update \
            nixpkgs \
            homebrew-homebrew-core \
            homebrew-homebrew-cask \
            homebrew-azure-bicep \
            homebrew-hashicorp-tap

      # bump 後 input rev を Rust（serde_json）が抽出する（bump 後版の eval は下の record が bump 済み lock で行う）。
      - name: bump 後の input rev を抽出
        id: revs
        env:
          DOTFILES_BIN: ${{ steps.build.outputs.bin }}
        run: |
          set -euo pipefail
          nixpkgs_new="$("$DOTFILES_BIN" update-history lock-rev --lock flake.lock --node nixpkgs)"
          cask_rev_new="$("$DOTFILES_BIN" update-history lock-rev --lock flake.lock --node homebrew-homebrew-cask)"
          {
            echo "nixpkgs_new=$nixpkgs_new"
            echo "cask_rev_new=$cask_rev_new"
          } >> "$GITHUB_OUTPUT"

      # record は bump 後 nix 版を bump 済み lock で `nix eval` し、nix 版差分・brew cask 版差分（reqwest で cask
      # `.rb` を取得し version 解析、sha256 未固定 cask の fail-closed 検査、subdir 解決）・ノート取得・OpenAI 要約・
      # TOML 記録までを 1 回で完結する。概要抽出の API キーは secret `OPEN_AI_API_KEY` を env で渡す（CLI が env から
      # 読み、argv / ログに出さない）。ノートが取れないものは version-only（version + notes_url のみ）として確定記録する。
      - name: record（nix/brew 版差分 + 概要）
        id: record
        env:
          DOTFILES_BIN: ${{ steps.build.outputs.bin }}
          NIXPKGS_OLD: ${{ steps.old.outputs.nixpkgs_old }}
          NIXPKGS_NEW: ${{ steps.revs.outputs.nixpkgs_new }}
          CASK_REV_OLD: ${{ steps.old.outputs.cask_rev_old }}
          CASK_REV_NEW: ${{ steps.revs.outputs.cask_rev_new }}
          REPO_BASE_SHA: ${{ steps.old.outputs.repo_base_sha }}
          # nix パッケージのリリースノートを GitHub Releases API から取得する際の認証用 token（未認証 60 req/hr →
          # 認証 5000 req/hr）。notes.rs::github_token() が env GITHUB_TOKEN を読む。LLM 用途ではないため
          # permissions: models: read は不要（contents: read で public release 取得に十分）。
          GITHUB_TOKEN: ${{ github.token }}
          # 概要抽出の OpenAI API キー（利用者が設定済みの secret。この厳密名で CLI が env から読む）。schedule は
          # GitHub の制約上常に既定ブランチで発火するためそのまま secret を受け取る。workflow_dispatch は
          # repo owner が **既定ブランチ ref** で手動起動した run に限って secret を受け取る。未審査 branch/tag の
          # Rust/Nix コードへ secret を渡さず、その他の dispatch では CLI は OpenAI 抽出を skip（version-only：
          # version + notes_url のみ）する。PR 起票・`static checks` status 投稿経路の既定ブランチ限定は
          # open-pr job 側で別途維持する（そこが信頼境界）。
          OPEN_AI_API_KEY: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && secrets.OPEN_AI_API_KEY || '' }}
        run: |
          set -euo pipefail
          at="$(date -u +%FT%TZ)"
          out="docs/update-history/$(date -u +%Y-%m).toml"
          # ノート取得元レジストリ（provenance の学習・再利用）。既存レジストリを再利用し、新規/未知の取得元だけを追記する。
          notes_sources="docs/update-history/notes-sources.toml"
          mkdir -p docs/update-history
          # devShell はバイナリをビルドした closure（bump 前 lock）に固定する。バイナリが起動する `nix eval` は
          # 別プロセスで tree の bump 後 flake.lock を読むため、評価対象は変わらない。`--no-write-lock-file` が
          # 無いと nix が参照 lock と tree の食い違いを書き戻そうとする。
          nix develop --reference-lock-file old-flake.lock --no-write-lock-file -c "$DOTFILES_BIN" update-history record \
            --lock-old old-flake.lock \
            --lock-new flake.lock \
            --cursor-old "$REPO_BASE_SHA" \
            --nix-old nix-old.json \
            --nixpkgs-old "$NIXPKGS_OLD" \
            --nixpkgs-new "$NIXPKGS_NEW" \
            --reference "$CI_REFERENCE" \
            --homebrew-nix nix/modules/homebrew.nix \
            --cask-rev-old "$CASK_REV_OLD" \
            --cask-rev-new "$CASK_REV_NEW" \
            --at "$at" \
            --notes-sources "$notes_sources" \
            --out "$out"
          # record が docs/update-history/ を変更したか（= 更新あり）を後段へ伝える。当月 TOML は既に repo に
          # commit 済みで checkout に存在しうるため、ファイル有無ではなく checkout からの差分有無で判定する
          # （無更新 no-op と真の download 失敗を取り違えないため）。差分があれば download を fail-closed にすべき夜。
          if [ -n "$(git status --porcelain -- docs/update-history)" ]; then
            echo "has_history=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_history=false" >> "$GITHUB_OUTPUT"
          fi

      # open-pr が commit するのは bump 後 flake.lock と履歴 TOML だけなので、job をまたぐ artifact もその 2 つに
      # 絞る。bump 前 lock（old-flake.lock）と bump 前 eval 版マップ（nix-old.json）は record と同一 job 内で
      # 完結するため渡さない。
      - name: bump 済み lock を artifact 化
        uses: actions/upload-artifact@v7
        with:
          name: bump-state
          retention-days: 1
          path: flake.lock
          if-no-files-found: error

      # 無更新の夜は record が TOML を書かず、docs/update-history/ のアップロード対象が 0 件になりうる。
      # `if-no-files-found: error` だと無更新夜が失敗扱いになるため `warn` で安全側に倒す（clean no-op）。
      - name: 履歴 TOML を artifact 化
        uses: actions/upload-artifact@v7
        with:
          name: history-record
          retention-days: 1
          path: |
            docs/update-history/
          if-no-files-found: warn

  # 2) PR 起票 + インラインセキュリティチェック（verify-bump-lock）+ 実 static checks + nix build + status 投稿
  #    + auto-merge。GITHUB_TOKEN で完結する（GitHub App / 別 secret は使わない）。GITHUB_TOKEN 起票 PR では
  #    `on: pull_request` の static-checks.yml が発火しないため、この job が同一 run 内で
  #    ①`cargo xtask ci verify-bump-lock`（許可パス + lock 差分の検査）、②`cargo xtask check static`、
  #    ③`nix build .#dotfiles-cli`（②③は static-checks.yml と同一。③は `doCheck = false` の derivation を
  #    build するため検証範囲は buildPhase の compile / link までである）の全てが合格した場合に限り
  #    `static checks` status を success で POST する。
  open-pr:
    name: open bump PR and enable auto-merge
    needs: bump
    # 非 dry-run（PR 起票・status 投稿経路）は既定ブランチ起動に限定する。schedule は常に既定ブランチで発火する
    # ため許可し、workflow_dispatch は dry_run=false かつ起動 ref が既定ブランチ（branch かつ既定ブランチ）のとき
    # だけ許可する。tag は許可しない: ref が `refs/heads/<既定ブランチ>` であることを `github.ref` で照合し、既定
    # ブランチ名と同名の tag（例 tag `main`）を除外する。これは信頼できない ref から検査主体をビルドして
    # `static checks` status を詐称投稿する経路を塞ぐ。
    if: >-
      ${{ github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
           github.event.inputs.dry_run == 'false' &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # 明示ガード（fail-closed の二重化）: 非既定 ref からの非 dry-run 起動を checkout 前に拒否する。job-level
      # `if` で既に skip される前提だが、評価差異で誤って到達しても信頼できない ref から検査主体をビルドする前に
      # ここで fail させる。schedule は既定ブランチ固定のため通過する。
      - name: 非既定 ref の非 dry-run を拒否（guard）
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            exit 0
          fi
          # branch かつ既定ブランチ（ref が refs/heads/<既定ブランチ>）のみ許可する。tag は除外する: ref_name
          # 単独照合だと既定ブランチ名と同名の tag が通り得るため、ref 全体を refs/heads/<既定ブランチ> と照合する。
          if [ "$REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::非既定 ref ($REF) からの非 dry-run open-pr は拒否します（既定ブランチ refs/heads/$DEFAULT_BRANCH からのみ許可）。" >&2
            exit 1
          fi

      # この nightly workflow 自身の ref（信頼 ref = 上のガードと job-level `if` で既定ブランチ起動に限定済み）を
      # checkout する。ここでビルドする `cargo xtask ci verify-bump-lock`（判定主体）も信頼コードである。
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # `/nix/store` はキャッシュしない。この job は static-checks.yml と同じ `cargo xtask check static` を走らせ、
      # その required check 相当の status を投稿するため、キャッシュ構成も static-checks.yml に揃える。

      # cargo registry/git キャッシュ（~/.cargo）だけを再利用する。この job は bump 済み lock（後段の
      # download-artifact で展開）の devShell でビルドするが、キャッシュ復元時点の checkout はまだ bump 前 lock
      # であるため、flake.lock ハッシュで `/nix/store` closure の一致を保証できない。target/ を復元すると GC 済み
      # store path を指した build script を踏みうるので registry/git だけ共有する。
      #
      # shared-key は static-checks.yml と分ける。あちらは closure 一致を保証できる（同一 lock でビルドする）ため
      # target/ まで載せたキーになっており、同じキーを共有すると復元できない target/ を巡って互いを潰し合う。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-open-pr-${{ runner.os }}
          cache-targets: false

      - name: bump 済み lock を取得
        uses: actions/download-artifact@v8
        with:
          name: bump-state

      # 無更新の夜（record が history を書かない）は history-record artifact が無く download が失敗するが、clean
      # no-op にするため失敗を許容する。一方 record が history を書いた夜（has_history=true）は download の一時失敗・
      # 権限/破損エラーを握り潰さず fail-closed にする（history 欠落のまま flake.lock 単独 bump PR が auto-merge
      # されるのを防ぐ）。失敗許容するのは無更新夜だけに限定する。
      - name: 履歴 TOML を取得
        uses: actions/download-artifact@v8
        continue-on-error: ${{ needs.bump.outputs.has_history != 'true' }}
        with:
          name: history-record
          path: docs/update-history

      - name: bump ブランチを作成して commit
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP_BASE_SHA: ${{ needs.bump.outputs.repo_base_sha }}
        run: |
          set -euo pipefail
          # 検査 base は実際の PR base（既定ブランチ）の SHA に揃える（checkout HEAD ではない）。
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          base_sha="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")"
          if [ "$base_sha" != "$BUMP_BASE_SHA" ]; then
            echo "::error::bump artifact base ($BUMP_BASE_SHA) と現在の ${DEFAULT_BRANCH} ($base_sha) が一致しません。最新 base で bump をやり直してください。" >&2
            exit 1
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          branch="nightly/bump-$(date -u +%Y%m%d%H%M%S)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock docs/update-history
          if git diff --cached --quiet; then
            echo "no changes to propose"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(deps): nightly flake.lock bump と更新履歴記録"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      # セキュリティチェック本体。判定主体は信頼 ref の dotfiles（このツリーで build）、検査対象は base..head の
      # commit パス union と両端 flake.lock 差分。許可外パス混入・許可外 input rev 変更・空 bump があれば非 0
      # 終了し、後続の static checks・status 投稿・PR 起票・merge へ進まない（fail-closed）。
      - name: セキュリティチェック（verify-bump-lock）をインライン実行
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        run: |
          set -euo pipefail
          # 判定主体（保守コマンド）を devShell 内 cargo で実行し、ランタイムライブラリを `nix develop -c` 経由で
          # 供給する。`cargo xtask check static` と同じ xtask 起動経路に揃える。
          nix develop -c cargo xtask ci verify-bump-lock \
            --base "${{ steps.commit.outputs.base_sha }}" \
            --head "${{ steps.commit.outputs.head_sha }}" \
            --repo .

      # 実 static checks を bump 後 lock で実行する。static-checks.yml と同一コマンドで、GITHUB_TOKEN 起票 bot PR
      # では他に誰も走らせないため必須。`nix flake check --all-systems` を含み、bump で config が eval 失敗して
      # いないかを auto-merge 前に検知する真のゲートになる。失敗すれば step 失敗で job が止まり status 投稿へ
      # 到達しない（required check 未充足・fail-closed）。
      - name: 実 static checks（cargo xtask check static）を bump 後 lock で実行
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        run: |
          set -euo pipefail
          nix develop -c cargo xtask check static

      # static-checks.yml の同名 step と同一。前段の static checks は devShell 内で走るため、build sandbox で
      # しか露見しない依存欠落（bootstrap が叩く derivation の buildInputs / nativeBuildInputs 漏れ等）を
      # 検出できない。bump 後 lock でその derivation 自体を build し、`static checks` status の意味を
      # static-checks.yml と揃える。derivation は `doCheck = false` なので検出できるのは buildPhase の
      # compile / link に現れる欠落までである。失敗すれば status 投稿へ到達しない（fail-closed）。
      - name: dotfiles-cli の nix build を bump 後 lock で実行
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        run: |
          set -euo pipefail
          nix build .#dotfiles-cli --no-link --print-build-logs

      - name: bump ブランチを push して PR 起票
        id: pr
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push origin "${{ steps.commit.outputs.branch }}"
          pr_url="$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "chore(deps): nightly flake.lock bump" \
            --body "nightly 自動 bump。nixpkgs と brew tap input の rev を更新し、更新履歴（版差分＋概要）を記録します。同一 run で \`cargo xtask ci verify-bump-lock\`、実 \`cargo xtask check static\`、\`nix build .#dotfiles-cli\`（後 2 者は static-checks.yml と同一）の全てが合格した場合のみ \`static checks\` status が投稿されます。Copilot/Codex の自動レビュー充足後に auto-merge されます。")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      # ①verify-bump-lock、②実 static checks、③dotfiles-cli の nix build の全てが合格した場合に限り PR head へ
      # `static checks` commit status を success で POST して required check を満たす。3 step は前段にあり、
      # いずれか失敗すれば job が止まり本 step に到達しない。`if: success()` を併用して前段成功を明示保証する。
      # context 名は適用済み
      # ruleset の required context（static-checks.yml の job 名 `static checks`）と一致させる。
      - name: required check `static checks` status を投稿
        if: ${{ success() && steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="static checks" \
            -f target_url="${RUN_URL}" \
            -f description="nightly-update run の verify-bump-lock + 実 static checks + nix build 合格"

      # codex 自動レビューを起動する（Copilot は GitHub 側のネイティブ code review で走る）。
      - name: codex レビューを依頼
        if: ${{ steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment "${{ steps.pr.outputs.pr_url }}" --body "@codex review"

      - name: auto-merge を有効化
        if: ${{ steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "${{ steps.pr.outputs.pr_url }}"
