name: nightly update

# nightly に repo の flake.lock を bump し、更新履歴を記録して自動 PR を起票・auto-merge する。
#
# 安全要件（plan「ゲート」「自己改変の封路」「設定の版管理と自己保護」準拠）:
#   - bump は nixpkgs と brew tap 4 本のみ。framework input（nix-darwin / home-manager / nix-homebrew）は
#     bump しない（無人で framework を動かさない）。
#   - 生リリースノート取得 + LLM 抽出は prompt injection 隔離のため `contents: read` の別 job に分離する。
#     その job だけが `models: read` を持ち、GITHUB_TOKEN で GitHub Models を使う（別 secret 不要）。
#   - PR 起票・auto-merge は最小権限 GitHub App token で行う。GITHUB_TOKEN 起票の PR は必須 check を発火
#     しない既知挙動のため、App token で起票して required status check `nightly-bump-guard` を発火させる。
#   - main へ入るのは required check（guard）通過後のみ。ruleset（bypass actors 空）が auto-merge を縛る。
#
# dry_run（workflow_dispatch 既定 true）では bump と record と diff までを実行し、PR 起票・push を行わない。
# 実発火（schedule）前に dry_run で両 closure build と TOML 生成を検証する運用を前提とする。

on:
  schedule:
    # 18:00 UTC（plan 例）。マージ後の朝に各マシンが追随する想定。
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら PR 起票・push をせず bump/record/diff のみ検証する"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CI_REFERENCE: darwinConfigurations.ci-ref

jobs:
  # 1) lock を bump し、bump 前後の参照 closure を build して artifact に渡す。
  #    LLM や PR 起票の権限を持たせない（contents: read のみ）。
  bump:
    name: bump lock and build closures
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      nixpkgs_old: ${{ steps.revs.outputs.nixpkgs_old }}
      nixpkgs_new: ${{ steps.revs.outputs.nixpkgs_new }}
      cask_rev_old: ${{ steps.revs.outputs.cask_rev_old }}
      cask_rev_new: ${{ steps.revs.outputs.cask_rev_new }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: 旧 closure と旧 rev を記録
        id: old
        run: |
          set -euo pipefail
          old_closure="$(nix build --no-link --print-out-paths ".#${CI_REFERENCE}.system")"
          echo "closure=$old_closure" >> "$GITHUB_OUTPUT"
          nixpkgs_old="$(nix eval --raw .#inputs.nixpkgs.rev 2>/dev/null || jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"
          echo "nixpkgs_old=$nixpkgs_old" >> "$GITHUB_OUTPUT"
          # brew cask 版差分（fix3）のため、bump 前の cask tap rev も記録する。
          cask_rev_old="$(jq -r '.nodes["homebrew-homebrew-cask"].locked.rev' flake.lock)"
          echo "cask_rev_old=$cask_rev_old" >> "$GITHUB_OUTPUT"

      - name: nixpkgs と tap input を bump
        run: |
          set -euo pipefail
          # framework input（nix-darwin / home-manager / nix-homebrew）は bump しない。
          nix flake update \
            nixpkgs \
            homebrew-homebrew-core \
            homebrew-homebrew-cask \
            homebrew-azure-bicep \
            homebrew-hashicorp-tap

      - name: 新 closure と新 rev を記録
        id: new
        run: |
          set -euo pipefail
          new_closure="$(nix build --no-link --print-out-paths ".#${CI_REFERENCE}.system")"
          echo "closure=$new_closure" >> "$GITHUB_OUTPUT"

      - name: rev を集約
        id: revs
        run: |
          set -euo pipefail
          echo "nixpkgs_old=${{ steps.old.outputs.nixpkgs_old }}" >> "$GITHUB_OUTPUT"
          nixpkgs_new="$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"
          echo "nixpkgs_new=$nixpkgs_new" >> "$GITHUB_OUTPUT"
          echo "cask_rev_old=${{ steps.old.outputs.cask_rev_old }}" >> "$GITHUB_OUTPUT"
          cask_rev_new="$(jq -r '.nodes["homebrew-homebrew-cask"].locked.rev' flake.lock)"
          echo "cask_rev_new=$cask_rev_new" >> "$GITHUB_OUTPUT"

      - name: bump 済み lock と closure path を artifact 化
        uses: actions/upload-artifact@v4
        with:
          name: bump-state
          retention-days: 1
          include-hidden-files: true
          path: |
            flake.lock
          if-no-files-found: error

  # 2) 生ノート取得 + LLM 抽出 + record。prompt injection を隔離するため contents: read のみで、
  #    GitHub Models を使う models: read をこの job にだけ与える。出力は更新履歴 TOML（信頼境界内の機械
  #    バリデート済み）として artifact に渡す。
  record:
    name: extract notes and record history
    needs: bump
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
      models: read
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # bump 前（checkout 直後の committed lock）の参照 closure を build する。download-artifact が
      # flake.lock を bump 後 lock で上書きする前に行うことで、実 old closure store path を得る（fix3:
      # 以前は old==new を record に渡して nix 差分が常に空だった）。
      - name: 旧参照 closure を build（bump 前 lock）
        id: old
        run: |
          set -euo pipefail
          old_closure="$(nix build --no-link --print-out-paths ".#${CI_REFERENCE}.system")"
          echo "closure=$old_closure" >> "$GITHUB_OUTPUT"

      - name: bump 済み lock を取得
        uses: actions/download-artifact@v4
        with:
          name: bump-state

      # 宣言 cask の版差分を old/new cask tap rev から決定論的に算出する（fix3）。ライブ brew 問い合わせは
      # せず、各 cask の `version` を tap rev の cask ファイルから読み、`name<TAB>old<TAB>new` の差分ファイルへ
      # 書く。これが record の `--brew-diff` 入力になり、brew 版差分が空縮退せず実取得される。取得できない
      # cask（letter subdir 解決失敗・404 等）はその cask 行を出さず、brew 差分は部分的になる（縮退は明示）。
      - name: brew cask 版差分を算出
        id: brew
        env:
          CASK_REV_OLD: ${{ needs.bump.outputs.cask_rev_old }}
          CASK_REV_NEW: ${{ needs.bump.outputs.cask_rev_new }}
          # gh は GH_TOKEN を env から読む。token は argv に乗せない。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          diff_file="$RUNNER_TEMP/brew-diff.tsv"
          : > "$diff_file"
          # 宣言 cask 名を homebrew.nix の casks 配列から抽出（"name" 行）。
          casks="$(sed -n '/casks = \[/,/\];/p' nix/modules/homebrew.nix \
            | grep -oE '"[^"]+"' | tr -d '"')"
          cask_version() {
            # $1=rev $2=cask 名。cask tap の Casks/<letter>/<name>.rb から version "..." を読む。
            local rev="$1" name="$2" letter
            letter="$(printf '%s' "$name" | cut -c1)"
            gh api "repos/homebrew/homebrew-cask/contents/Casks/${letter}/${name}.rb?ref=${rev}" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null \
              | grep -oE 'version "[^"]+"' | head -n1 | sed -E 's/version "([^"]+)"/\1/' || true
          }
          for name in $casks; do
            old_v="$(cask_version "$CASK_REV_OLD" "$name")"
            new_v="$(cask_version "$CASK_REV_NEW" "$name")"
            # 両 rev とも取得できないものは差分対象にしない（縮退）。
            [ -z "$old_v" ] && [ -z "$new_v" ] && continue
            # 版変更なし（old==new）の cask は更新ではないため diff へ出さない（F5 ノイズ抑制）。
            # adapter 側でも落とすが、差分ファイル段階で除外して空 record/no-op エントリを根元から防ぐ。
            [ "$old_v" = "$new_v" ] && continue
            printf '%s\t%s\t%s\n' "$name" "${old_v:-∅}" "${new_v:-∅}" >> "$diff_file"
          done
          echo "diff_file=$diff_file" >> "$GITHUB_OUTPUT"

      - name: 新参照 closure を build して record
        env:
          OLD_CLOSURE: ${{ steps.old.outputs.closure }}
          NIXPKGS_OLD: ${{ needs.bump.outputs.nixpkgs_old }}
          NIXPKGS_NEW: ${{ needs.bump.outputs.nixpkgs_new }}
          CASK_REV_NEW: ${{ needs.bump.outputs.cask_rev_new }}
          BREW_DIFF: ${{ steps.brew.outputs.diff_file }}
          # GitHub Models は GITHUB_TOKEN で使う。別 secret は持たせない。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # この時点で flake.lock は download-artifact により bump 後 lock へ上書き済み。よってここで build
          # した closure は new。old は前ステップで bump 前 lock から build した実 store path（fix3）。両者を
          # record へ渡し、nix adapter が `nix store diff-closures old new` で実差分を算出する（old==new で
          # 空縮退しない）。
          new_closure="$(nix build --no-link --print-out-paths ".#${CI_REFERENCE}.system")"
          at="$(date -u +%FT%TZ)"
          out="docs/update-history/$(date -u +%Y-%m).toml"
          mkdir -p docs/update-history
          # notes-base: new cask tap rev の Casks 配下を基底にし、record adapter が `<base><name>` で
          # cask 定義（homepage/url を含む）を取得する。letter subdir を解決できない cask は 404 となり、
          # その cask は version+notes_url 縮退（graceful degradation）になる。許可ホスト https のみ取得する。
          notes_base="https://raw.githubusercontent.com/homebrew/homebrew-cask/${CASK_REV_NEW}/Casks/"
          nix develop -c dotfiles update-history record \
            --old "$OLD_CLOSURE" \
            --new "$new_closure" \
            --old-rev "$NIXPKGS_OLD" \
            --new-rev "$NIXPKGS_NEW" \
            --nixpkgs-old "$NIXPKGS_OLD" \
            --nixpkgs-new "$NIXPKGS_NEW" \
            --reference "$CI_REFERENCE" \
            --at "$at" \
            --brew-diff "$BREW_DIFF" \
            --notes-base "$notes_base" \
            --out "$out"

      - name: 履歴 TOML を artifact 化
        uses: actions/upload-artifact@v4
        with:
          name: history-record
          retention-days: 1
          path: |
            docs/update-history/
          if-no-files-found: error

  # 3) PR 起票 + auto-merge。最小権限 GitHub App token を使う（GITHUB_TOKEN 起票だと必須 check が発火しない）。
  #    App ID / private key は repo secret 参照のみ（値は repo に置かない）。
  open-pr:
    name: open bump PR and enable auto-merge
    needs: [bump, record]
    if: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: GitHub App token を生成
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NIGHTLY_BUMP_APP_ID }}
          private-key: ${{ secrets.NIGHTLY_BUMP_APP_PRIVATE_KEY }}

      - name: checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: bump 済み lock を取得
        uses: actions/download-artifact@v4
        with:
          name: bump-state

      - name: 履歴 TOML を取得
        uses: actions/download-artifact@v4
        with:
          name: history-record
          path: docs/update-history

      - name: bump ブランチを作成して PR 起票
        id: pr
        env:
          # App token を使う。token は argv ではなく env 経由で gh に渡し、ログに出さない。
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="nightly/bump-$(date -u +%Y%m%d%H%M%S)"
          git switch -c "$branch"
          git config user.name "nightly-bump[bot]"
          git config user.email "nightly-bump[bot]@users.noreply.github.com"
          git add flake.lock docs/update-history
          if git diff --cached --quiet; then
            echo "no changes to propose"; exit 0
          fi
          git commit -m "chore(deps): nightly flake.lock bump と更新履歴記録"
          git push origin "$branch"
          pr_url="$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore(deps): nightly flake.lock bump" \
            --body "nightly 自動 bump。nixpkgs と brew tap input の rev を更新し、更新履歴を記録します。required status check \`nightly-bump-guard\` 通過後に auto-merge されます。")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: auto-merge を有効化
        if: ${{ steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "${{ steps.pr.outputs.pr_url }}"
