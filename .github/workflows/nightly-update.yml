name: nightly update

# nightly に repo の flake.lock を bump し、更新履歴（版差分＋概要）を記録して自動 PR を起票・auto-merge する。
#
# 無人 bump の対象、auto-merge を止めるゲートの検査範囲、取得先期待値表の保守義務は
# docs/automation/nightly-lock-bump.md を正本とする。

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら PR 起票・push をせず bump/record/diff のみ検証する"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CI_REFERENCE: darwinConfigurations.ci-ref

jobs:
  # bump 前 eval・bump・record を 1 job に置く。判定主体の dotfiles バイナリを job 分割すると同じビルドを
  # 2 回払うことになる（job 間で渡せるのは lock と JSON だけで、ビルド成果物は渡らない）。
  # PR 起票の権限は持たせない（contents: read のみ）。
  bump:
    name: bump lock and record history
    # darwin 設定を eval するため macOS runner。`macos-latest` は指す先が移ると runner 側 toolchain と SDK の
    # 前提が黙って動くため、構成対象の実機と同じ版に固定する。
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      repo_base_sha: ${{ steps.old.outputs.repo_base_sha }}
      # record が当月 history TOML を書いたか。open-pr 側の history download を fail-closed にするかを分岐する。
      has_history: ${{ steps.record.outputs.has_history }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # `/nix/store` はキャッシュしない（static-checks.yml と同じ判断）。macOS runner では復元だけで
      # timeout-minutes を食い潰し bump 本体へ到達できない。store path は cache.nixos.org から substitute する。

      # この job の cargo ビルドは全て bump 前 devShell で走るため、キーの導出も `nix flake update` より前で
      # 行い、bump 後 lock の closure をキーにしない。
      - name: cargo build closure の derivation を確定
        id: closure
        run: |
          set -euo pipefail
          drv="$(nix path-info --derivation .#cargo-build-inputs)"
          echo "key=$(basename "$drv" .drv)" >> "$GITHUB_OUTPUT"

      # `cmd-format` は置かない。置くと rust-cache の post step が `nix flake update` の後に `nix develop -c` を
      # 実行し、この job が他では使わない bump 後 devShell を毎晩余計に実体化する。shared-key の
      # `.#cargo-build-inputs` drv 名が rustc と link 対象を押さえるため、target/ の一致はそれでも保たれる。
      #
      # 保存は既定ブランチ起動だけに絞る。この job には job-level gate が無く任意 ref の dry_run dispatch でも
      # 走るため、絞らないと非既定ブランチ scope の cache が上限を消費し、PR と main が読む分を evict する。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-bump-${{ runner.os }}-${{ steps.closure.outputs.key }}
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # このビルドと直後の bump 前 eval は `nix flake update` より前で完結させる。後ろへ移すとバイナリは
      # bump 後 devShell でビルドされ、bump 前 lock の snapshot と bump 前版の eval も bump 後 lock を見る
      # ことになり、版差分の基準が消える。実行は devShell 内ビルドに合わせて `nix develop -c` 経由にする。
      - name: dotfiles バイナリをビルド
        id: build
        run: |
          set -euo pipefail
          nix develop -c cargo build -p dotfiles-cli
          echo "bin=$PWD/target/debug/dotfiles" >> "$GITHUB_OUTPUT"

      - name: bump 前の宣言パッケージ版を eval と rev 抽出
        id: old
        env:
          DOTFILES_BIN: ${{ steps.build.outputs.bin }}
        run: |
          set -euo pipefail
          cp flake.lock old-flake.lock
          nix develop -c "$DOTFILES_BIN" update-history eval-versions --reference "$CI_REFERENCE" --out nix-old.json
          echo "repo_base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          nixpkgs_old="$("$DOTFILES_BIN" update-history lock-rev --lock flake.lock --node nixpkgs)"
          echo "nixpkgs_old=$nixpkgs_old" >> "$GITHUB_OUTPUT"
          cask_rev_old="$("$DOTFILES_BIN" update-history lock-rev --lock flake.lock --node homebrew-homebrew-cask)"
          echo "cask_rev_old=$cask_rev_old" >> "$GITHUB_OUTPUT"

      - name: 全 input を bump
        run: |
          set -euo pipefail
          nix flake update

      - name: bump 後の input rev を抽出
        id: revs
        env:
          DOTFILES_BIN: ${{ steps.build.outputs.bin }}
        run: |
          set -euo pipefail
          nixpkgs_new="$("$DOTFILES_BIN" update-history lock-rev --lock flake.lock --node nixpkgs)"
          cask_rev_new="$("$DOTFILES_BIN" update-history lock-rev --lock flake.lock --node homebrew-homebrew-cask)"
          {
            echo "nixpkgs_new=$nixpkgs_new"
            echo "cask_rev_new=$cask_rev_new"
          } >> "$GITHUB_OUTPUT"

      # bump 後 lock の回収は record より前に済ませる。後ろに置くと暗黙の `success()` により record 以降で
      # 落ちた夜は upload 自体が skip され、その夜の bump 後 lock を回収できない。前に置けば bump job が
      # 途中で落ちた夜も lock が残る。以降の step は flake.lock を書き換えないため内容は job 末尾と同じ。
      - name: bump 済み lock を artifact 化
        uses: actions/upload-artifact@v7
        with:
          name: bump-state
          retention-days: 1
          path: flake.lock
          if-no-files-found: error

      # 概要抽出の API キーは secret を env で渡す（CLI が env から読み、argv / ログに出さない）。
      - name: record（nix/brew 版差分 + 概要）
        id: record
        env:
          DOTFILES_BIN: ${{ steps.build.outputs.bin }}
          NIXPKGS_OLD: ${{ steps.old.outputs.nixpkgs_old }}
          NIXPKGS_NEW: ${{ steps.revs.outputs.nixpkgs_new }}
          CASK_REV_OLD: ${{ steps.old.outputs.cask_rev_old }}
          CASK_REV_NEW: ${{ steps.revs.outputs.cask_rev_new }}
          REPO_BASE_SHA: ${{ steps.old.outputs.repo_base_sha }}
          # GitHub Releases API のレート制限を認証枠へ上げるための token（LLM 用途ではない）。
          GITHUB_TOKEN: ${{ github.token }}
          # 未審査 branch/tag の Rust/Nix コードへ secret を渡さないため、secret を受け取るのは schedule
          # （GitHub の制約上常に既定ブランチで発火する）と、repo owner が既定ブランチ ref で起動した
          # workflow_dispatch に限る。それ以外の dispatch では CLI が OpenAI 抽出を skip する。
          OPEN_AI_API_KEY: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && secrets.OPEN_AI_API_KEY || '' }}
        run: |
          set -euo pipefail
          at="$(date -u +%FT%TZ)"
          out="docs/update-history/$(date -u +%Y-%m).toml"
          notes_sources="docs/update-history/notes-sources.toml"
          mkdir -p docs/update-history
          # devShell はバイナリをビルドした closure（bump 前 lock）に固定する。バイナリが起動する `nix eval` は
          # 別プロセスで tree の bump 後 flake.lock を読むため、評価対象は変わらない。`--no-write-lock-file` が
          # 無いと nix が参照 lock と tree の食い違いを書き戻そうとする。
          nix develop --reference-lock-file old-flake.lock --no-write-lock-file -c "$DOTFILES_BIN" update-history record \
            --lock-old old-flake.lock \
            --lock-new flake.lock \
            --cursor-old "$REPO_BASE_SHA" \
            --nix-old nix-old.json \
            --nixpkgs-old "$NIXPKGS_OLD" \
            --nixpkgs-new "$NIXPKGS_NEW" \
            --reference "$CI_REFERENCE" \
            --cask-rev-old "$CASK_REV_OLD" \
            --cask-rev-new "$CASK_REV_NEW" \
            --at "$at" \
            --notes-sources "$notes_sources" \
            --out "$out"
          # 当月 TOML は既に repo に commit 済みで checkout に存在しうるため、ファイル有無ではなく checkout
          # からの差分有無で判定する（無更新 no-op と真の download 失敗を取り違えないため）。
          if [ -n "$(git status --porcelain -- docs/update-history)" ]; then
            echo "has_history=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_history=false" >> "$GITHUB_OUTPUT"
          fi

      # 無更新の夜はアップロード対象が 0 件になりうるため `warn` にする（clean no-op）。
      - name: 履歴 TOML を artifact 化
        uses: actions/upload-artifact@v7
        with:
          name: history-record
          retention-days: 1
          path: |
            docs/update-history/
          if-no-files-found: warn

  # bot PR では `on: pull_request` が発火せず static-checks.yml が代替実行されないため、同 workflow が持つ
  # 実挙動 gate（構成適用 + zsh checks）を同一 run 内でここが実行する。open-pr から分けるのは、open-pr が
  # PR push と status 投稿のため write 権限を持ち `cachix/install-nix-action` へ `github_access_token` を
  # 渡す job だからである。gate ごとの実行 job は docs/automation/nightly-lock-bump.md の表を正本とする。
  runtime-gate:
    name: apply configuration and run zsh checks
    needs: bump
    # 起動条件は open-pr と同一にする。この job が gate するのは open-pr が投稿する `static checks` status
    # だけなので、open-pr が走らない起動では実行する対象も無い。
    if: >-
      ${{ github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
           github.event.inputs.dry_run == 'false' &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # gate の対象は bump 後 lock の構成なので、適用より前に bump 済み lock をツリーへ展開する。
      - name: bump 済み lock を取得
        uses: actions/download-artifact@v8
        with:
          name: bump-state

      # derivation hash は build 入力の関数なので、そのまま cache key にできる。
      - name: dotfiles-cli の derivation を確定
        id: cli
        run: |
          set -euo pipefail
          drv="$(nix path-info --derivation .#dotfiles-cli)"
          echo "key=$(basename "$drv" .drv)" >> "$GITHUB_OUTPUT"

      # `nix run .#default` は dotfiles-cli（`packages.default`）を要求する。cache 置き場は作業ツリー外に取る。
      - name: dotfiles-cli ビルド成果物キャッシュを復元
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dotfiles-nixcache
          key: dotfiles-cli-nix-${{ runner.os }}-${{ steps.cli.outputs.key }}

      - name: 成果物を store へ復元
        if: ${{ steps.cli-cache.outputs.cache-hit == 'true' }}
        run: nix copy --from "file://$HOME/.cache/dotfiles-nixcache" --no-check-sigs .#dotfiles-cli

      # 適用経路は static-checks.yml と同一で、利用者が叩くのと同じ `dotfiles init` / `dotfiles switch`。
      - name: 構成を適用して zsh checks を bump 後 lock で実行
        env:
          # 実フリートの `home-manager.backupFileExtension` と同じ値。standalone activation では
          # この指定が無いと既存ファイルを前にして止まる。
          HOME_MANAGER_BACKUP_EXT: before-home-manager
        run: |
          set -euo pipefail
          nix run .#default -- init --source "path:$PWD"
          nix run .#default -- switch home
          nix develop -c bats --print-output-on-failure tests/zsh

      # cache scope の条件を投稿経路の gate に暗黙依存させない。
      - name: 成果物をキャッシュへ書き出し
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        run: nix copy --to "file://$HOME/.cache/dotfiles-nixcache?compression=zstd" --no-check-sigs .#dotfiles-cli

      - name: 成果物キャッシュを保存
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dotfiles-nixcache
          key: dotfiles-cli-nix-${{ runner.os }}-${{ steps.cli.outputs.key }}

  # GITHUB_TOKEN が起票した PR では `on: pull_request` の static-checks.yml が発火しないため、この job が
  # 同一 run 内で残りのゲートを実行し、runtime-gate を含め全て合格した場合に限り `static checks` status を
  # 投稿する。
  open-pr:
    name: open bump PR and enable auto-merge
    needs: [bump, runtime-gate]
    # 非 dry-run（PR 起票・status 投稿経路）は既定ブランチ起動に限定し、信頼できない ref から検査主体を
    # ビルドして `static checks` status を詐称投稿する経路を塞ぐ。tag は許可しない: ref 全体を
    # `refs/heads/<既定ブランチ>` と照合し、既定ブランチ名と同名の tag を除外する。
    if: >-
      ${{ github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
           github.event.inputs.dry_run == 'false' &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # fail-closed の二重化: job-level `if` の評価差異で誤って到達しても、信頼できない ref から検査主体を
      # ビルドする前（checkout 前）に fail させる。
      - name: 非既定 ref の非 dry-run を拒否（guard）
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            exit 0
          fi
          # ref_name 単独照合だと既定ブランチ名と同名の tag が通り得るため、ref 全体を照合する。
          if [ "$REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::非既定 ref ($REF) からの非 dry-run open-pr は拒否します（既定ブランチ refs/heads/$DEFAULT_BRANCH からのみ許可）。" >&2
            exit 1
          fi

      # checkout の既定は write token をローカル Git 設定へ書き込み、以降の全 step から読める状態にする。
      # token を使うのは push step だけなので、そこへ credential helper 経由で渡す。
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Nix を導入
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # cargo キャッシュより前に bump 済み lock をツリーへ展開する。この job がビルドに使う devShell は
      # bump 後 lock のものなので、キーもそこから導出しなければ復元した target/ の前提と食い違う。
      - name: bump 済み lock を取得
        uses: actions/download-artifact@v8
        with:
          name: bump-state

      # build script が link する C ライブラリと toolchain の store path だけを入力に持つ derivation をキーに
      # する。closure が動いた晩は必ず別キーになり、合わない target/ は復元しない。
      - name: cargo build closure の derivation を確定
        id: closure
        run: |
          set -euo pipefail
          drv="$(nix path-info --derivation .#cargo-build-inputs)"
          echo "key=$(basename "$drv" .drv)" >> "$GITHUB_OUTPUT"

      # shared-key は static-checks.yml と同一文字列にして main scope の cache を共有する。`cmd-format` も
      # 置く。これが無いとキーの rust environment hash が runner 側 rustup の `rustc -vV` で決まり、devShell の
      # rustc で決まる static-checks.yml 側のキーと一致しなくなる。
      - name: cargo build キャッシュ
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-checks-${{ runner.os }}-${{ steps.closure.outputs.key }}
          cmd-format: nix develop -c {0}
          cache-targets: true
          # cache scope の条件を投稿経路の gate に暗黙依存させない。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 失敗を許容するのは無更新の夜（artifact そのものが無い clean no-op）だけに限定する。history を書いた夜に
      # download 失敗を握り潰すと、history 欠落のまま flake.lock 単独 bump PR が auto-merge されうる。
      - name: 履歴 TOML を取得
        uses: actions/download-artifact@v8
        continue-on-error: ${{ needs.bump.outputs.has_history != 'true' }}
        with:
          name: history-record
          path: docs/update-history

      - name: bump ブランチを作成して commit
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP_BASE_SHA: ${{ needs.bump.outputs.repo_base_sha }}
        run: |
          set -euo pipefail
          # 検査 base は実際の PR base（既定ブランチ）の SHA に揃える（checkout HEAD ではない）。
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          base_sha="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")"
          if [ "$base_sha" != "$BUMP_BASE_SHA" ]; then
            echo "::error::bump artifact base ($BUMP_BASE_SHA) と現在の ${DEFAULT_BRANCH} ($base_sha) が一致しません。最新 base で bump をやり直してください。" >&2
            exit 1
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          branch="nightly/bump-$(date -u +%Y%m%d%H%M%S)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock docs/update-history
          if git diff --cached --quiet; then
            echo "no changes to propose"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(deps): nightly flake.lock bump と更新履歴記録"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      # 判定主体は信頼 ref の checkout でビルドしたバイナリ、検査対象は base..head の commit パス union と
      # 両端の flake.lock 差分。
      - name: セキュリティチェック（verify-bump-lock）をインライン実行
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        run: |
          set -euo pipefail
          nix develop -c cargo xtask ci verify-bump-lock \
            --base "${{ steps.commit.outputs.base_sha }}" \
            --head "${{ steps.commit.outputs.head_sha }}" \
            --repo .

      # static-checks.yml と同一コマンド。GITHUB_TOKEN 起票 bot PR では他に誰も走らせないためここで実行する。
      - name: 実 static checks（cargo xtask check static）を bump 後 lock で実行
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        run: |
          set -euo pipefail
          nix develop -c cargo xtask check static

      # `nix build .#dotfiles-cli` は runtime-gate が `nix run .#default` で実行する（同一 derivation）。
      # ここへ置くと、runtime-gate が同じ key で保存した cache を必ず復元して store path 確認へ退化し、
      # build sandbox でしか露見しない依存欠落を検出しなくなる。

      - name: bump ブランチを push して PR 起票
        id: pr
        if: ${{ steps.commit.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # credential helper は呼ばれた時点で env から token を読むため、設定値に secret が残らない。
          # shellcheck disable=SC2016 # 展開させないのが目的（helper 実行時に git が展開する）
          git config --local credential.helper '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          git push origin "${{ steps.commit.outputs.branch }}"
          pr_url="$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "chore(deps): nightly flake.lock bump" \
            --body "nightly 自動 bump。flake.lock の全 input（framework input と推移 input を含む）の rev を更新し、更新履歴（版差分＋概要）を記録します。同一 run で \`cargo xtask ci verify-bump-lock\`、実 \`cargo xtask check static\`、runtime-gate job での \`dotfiles-cli\` の build と構成適用後の \`bats tests/zsh\`（後 3 者は static-checks.yml と同一）の全てが合格した場合のみ \`static checks\` status が投稿されます。auto-merge は「main」ruleset の required requirement が揃った時点で成立します（AI レビューの完了は条件に含まれません。docs/automation/nightly-lock-bump.md を参照）。")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      # 全ゲートが合格した場合に限り status を投稿する。同 job 内のゲートは `if: success()` が、構成適用と
      # zsh checks は `needs: runtime-gate` が担保する。context 名は適用済み ruleset の required context
      # （static-checks.yml の job 名）と一致させる。
      - name: required check `static checks` status を投稿
        if: ${{ success() && steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="static checks" \
            -f target_url="${RUN_URL}" \
            -f description="nightly-update run の verify-bump-lock + 実 static checks + runtime-gate の build と zsh checks 合格"

      # codex 自動レビューを起動する（Copilot は GitHub 側のネイティブ code review で走る）。
      - name: codex レビューを依頼
        if: ${{ steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment "${{ steps.pr.outputs.pr_url }}" --body "@codex review"

      # 成立条件は「main」ruleset の required requirement だけで、直前の codex 依頼への応答は待たない。
      - name: auto-merge を有効化
        if: ${{ steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "${{ steps.pr.outputs.pr_url }}"
