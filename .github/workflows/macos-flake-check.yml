name: macOS flake check

on:
  workflow_dispatch:
    inputs:
      target:
        description: "手動実行する flake 検証"
        required: true
        default: all
        type: choice
        options:
          - all
          - flake-check
          - ya
          - ya-x86_64-darwin
          - home-runner
          - home-dotfilesci
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    access-tokens = github.com=${{ github.token }}

jobs:
  flake-check:
    name: nix flake check
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'flake-check' }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: flake.lock を確認
        run: test -s flake.lock

      - name: Nix を導入
        uses: DeterminateSystems/nix-installer-action@v20
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: nix flake check
        run: |
          set -euxo pipefail
          nix --extra-experimental-features "nix-command flakes" flake check --no-update-lock-file

  eval-ya:
    name: ya output を評価
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ya' }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: flake.lock を確認
        run: test -s flake.lock

      - name: Nix を導入
        uses: DeterminateSystems/nix-installer-action@v20
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: ya output を評価
        run: |
          set -euxo pipefail
          nix --extra-experimental-features "nix-command flakes" eval --no-update-lock-file .#homeConfigurations.ya.activationPackage.drvPath
          nix --extra-experimental-features "nix-command flakes" eval --no-update-lock-file .#darwinConfigurations.ya.system
          test "$(nix --extra-experimental-features "nix-command flakes" eval --no-update-lock-file .#darwinConfigurations.ya.config.nix-homebrew.enable)" = "true"
          test "$(nix --extra-experimental-features "nix-command flakes" eval --no-update-lock-file .#darwinConfigurations.ya.config.nix-homebrew.mutableTaps)" = "false"
          test "$(nix --extra-experimental-features "nix-command flakes" eval --no-update-lock-file .#darwinConfigurations.ya.config.homebrew.enable)" = "true"
          test "$(nix --extra-experimental-features "nix-command flakes" eval --json --no-update-lock-file .#darwinConfigurations.ya.config.nix-homebrew.taps --apply builtins.attrNames)" = '["azure/homebrew-bicep","homebrew/homebrew-cask","homebrew/homebrew-core"]'
          test "$(nix --extra-experimental-features "nix-command flakes" eval --json --no-update-lock-file .#darwinConfigurations.ya.config.homebrew.taps --apply 'map (tap: tap.name)')" = '["homebrew/homebrew-core","homebrew/homebrew-cask","azure/bicep"]'
          test "$(nix --extra-experimental-features "nix-command flakes" eval --raw --no-update-lock-file .#darwinConfigurations.ya.config.homebrew.taps --apply 'taps: (builtins.elemAt (builtins.filter (tap: tap.name == "azure/bicep") taps) 0).clone_target')" = "https://github.com/Azure/homebrew-bicep"
          nix --extra-experimental-features "nix-command flakes" build --no-update-lock-file --no-link .#homeConfigurations.ya.activationPackage
          nix --extra-experimental-features "nix-command flakes" build --no-update-lock-file --no-link .#darwinConfigurations.ya.system

  eval-runner:
    name: runner Home Manager output を評価
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'home-runner' }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: flake.lock を確認
        run: test -s flake.lock

      - name: Nix を導入
        uses: DeterminateSystems/nix-installer-action@v20
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: runner Home Manager output を評価
        run: |
          set -euxo pipefail
          nix --extra-experimental-features "nix-command flakes" eval --no-update-lock-file .#homeConfigurations.runner.activationPackage.drvPath
          nix --extra-experimental-features "nix-command flakes" build --no-update-lock-file --no-link .#homeConfigurations.runner.activationPackage

  eval-dotfilesci:
    name: dotfilesci Home Manager output を評価
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'home-dotfilesci' }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: flake.lock を確認
        run: test -s flake.lock

      - name: Nix を導入
        uses: DeterminateSystems/nix-installer-action@v20
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: dotfilesci Home Manager output を評価
        run: |
          set -euxo pipefail
          nix --extra-experimental-features "nix-command flakes" eval --no-update-lock-file .#homeConfigurations.dotfilesci.activationPackage.drvPath
          nix --extra-experimental-features "nix-command flakes" build --no-update-lock-file --no-link .#homeConfigurations.dotfilesci.activationPackage

  eval-ya-x86_64-darwin:
    name: ya x86_64-darwin output を評価
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ya-x86_64-darwin' }}
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: flake.lock を確認
        run: test -s flake.lock

      - name: Nix を導入
        uses: DeterminateSystems/nix-installer-action@v20
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: ya x86_64-darwin output を評価
        run: |
          set -euxo pipefail
          nix --extra-experimental-features "nix-command flakes" eval --no-update-lock-file .#homeConfigurations.ya-x86_64-darwin.activationPackage.drvPath
          nix --extra-experimental-features "nix-command flakes" eval --no-update-lock-file .#darwinConfigurations.ya-x86_64-darwin.system
          nix --extra-experimental-features "nix-command flakes" build --no-update-lock-file --no-link .#homeConfigurations.ya-x86_64-darwin.activationPackage
          nix --extra-experimental-features "nix-command flakes" build --no-update-lock-file --no-link .#darwinConfigurations.ya-x86_64-darwin.system
