name: nightly bump guard

# nightly 自動 bump PR を無人 auto-merge してよいかを機械判定する required status check。
#
# この workflow は `nightly-update.yml`（bump を作る側）とは独立に、すべての pull_request 上で走る。
# job 名 = check context 名を固定 `nightly-bump-guard` にし、ruleset（.github/rulesets/nightly-bump.json）の
# required status check と一致させる。一致しないと required check が発火せず fail-open するため、名前は
# load-bearing である。
#
# 適用範囲（重要）: 厳格検査は **nightly bump PR にだけ** 強制する。判定は PR head ブランチが nightly bump の
# 固定 prefix（`nightly/bump-`。`nightly-update.yml` の起票ブランチに一致）かで行う。それ以外の通常 PR では
# 制約を課さず pass（exit 0）する。こうしないと bypass actors 空の required check が全 PR を恒久マージ不能に
# する。required check 自体は全 PR で発火するが（通常 PR では成功）、nightly PR でだけ verify-bump-lock を実行
# して fail させうる。なお nightly PR は許可パスが flake.lock + docs/update-history/** に限定されているため、
# guard/ruleset/workflow 自身の自己改変は nightly ブランチからは許可パス外として fail する（自己改変の封路）。
#
# 判定実体は shell ではなく `dotfiles ci verify-bump-lock`（Rust unit test で固定した純粋核）に置く。
# 変更パスが flake.lock + docs/update-history/** に限定され、flake.lock 差分が許可 input の rev 変更だけ
# であることを、base..head の **全 commit** を union した変更パス（`git log --name-only` 由来）に対して検査
# する。net diff ではなく全 commit union を一次防御に使うため、途中 commit で逸脱パスを足して head で消す
# add-then-remove も検出でき、`--squash` マージ運用の有無に依存しない。
#
# **検査者と検査対象の分離（重要・セキュリティ）**: guard を **PR 自身のコードでビルドして実行しない**。
# pull_request の checkout は PR の merge branch を置くため、PR の作業ツリーで `dotfiles ci verify-bump-lock`
# を動かすと、悪意ある nightly PR が verify-bump-lock を改竄して guard を常に pass させられる（gate 回避）。
# よって guard バイナリは **信頼できる base ref（マージ先 = 既定ブランチ）の dotfiles** からビルドし
# （`trusted-tree`）、検査対象（PR の base..head 差分・lock）は別 checkout（`pr-tree`）を `--repo` で指す。
# 判定主体（trusted dotfiles）と検査対象（PR の git データ）を分離することで、PR head のコード改竄で gate を
# 回避できないようにする。

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nightly-bump-guard:
    name: nightly-bump-guard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # nightly bump PR か（head ブランチが固定 prefix `nightly/bump-` か）を判定する。pull_request 以外
      # （workflow_dispatch）では head ref が無いため、手動検証経路として常に nightly 扱いで強制検査する。
      - name: 対象判定（nightly bump PR か）
        id: scope
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "enforce=true" >> "$GITHUB_OUTPUT"
          elif [ "${PR_HEAD_REF#nightly/bump-}" != "$PR_HEAD_REF" ]; then
            echo "enforce=true" >> "$GITHUB_OUTPUT"
          else
            echo "enforce=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 通常 PR は no-op success（nightly bump 制約は課さない）
        if: ${{ steps.scope.outputs.enforce != 'true' }}
        run: |
          echo "nightly-bump-guard: non-nightly PR; skipping bump-lock enforcement (pass)"

      # 検査対象（PR の作業ツリー）の checkout。base..head の全 commit と両端の flake.lock を git で参照する
      # ため全履歴を取得する。**この作業ツリーの dotfiles コードは検査主体にしない**（PR が verify-bump-lock を
      # 改竄して guard を常 pass にする回避を防ぐ）。ここは「検査対象の git データ（lock・変更パス）」だけを置く。
      - name: 検査対象（PR）を checkout
        if: ${{ steps.scope.outputs.enforce == 'true' }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: pr-tree

      # 検査者（trusted dotfiles）の checkout。base ref（= PR のマージ先 = 既定ブランチ）の dotfiles を別途
      # 取得し、その信頼コードから guard バイナリをビルドする。PR head が verify-bump-lock を書き換えても、
      # 判定主体は base 側の信頼コードのままなので gate を回避できない（検査対象と検査者を分離する）。
      - name: 検査者（trusted base の dotfiles）を checkout
        if: ${{ steps.scope.outputs.enforce == 'true' }}
        uses: actions/checkout@v5
        with:
          # pull_request では base ブランチ（マージ先）を信頼 ref にする。workflow_dispatch では base が無い
          # ため既定ブランチを使う。PR head の ref/sha は信頼 ref に**しない**。
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          path: trusted-tree

      - name: Nix を導入
        if: ${{ steps.scope.outputs.enforce == 'true' }}
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: nightly bump guard（trusted dotfiles で PR の lock を検査）
        if: ${{ steps.scope.outputs.enforce == 'true' }}
        env:
          # pull_request 以外（workflow_dispatch）では base/head が無いため、その場合は既定 branch を base に、
          # 現在 ref を head にして手動検証できるようにする。
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-origin/${DEFAULT_BRANCH}}"
          head="${PR_HEAD_SHA:-${{ github.sha }}}"
          # 検査者は trusted-tree（base ref の dotfiles）からビルドし、検査対象は pr-tree（PR の git データ）を
          # `--repo` で指す。これにより「判定ロジック=信頼 base / 検査対象 lock・変更パス=PR」を分離する。
          # base/head SHA は pr-tree の履歴に存在する（fetch-depth: 0 で全履歴取得済み）。
          nix develop ./trusted-tree -c \
            dotfiles ci verify-bump-lock \
            --base "$base" \
            --head "$head" \
            --repo pr-tree
