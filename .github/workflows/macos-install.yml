name: macOS runtime integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    access-tokens = github.com=${{ github.token }}
  DOTFILES_TEST_SOURCE_HASH: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  runtime:
    name: bootstrap から darwin switch まで検証
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DOTFILES_TEST_SOURCE_HASH }}

      - name: runtime integration
        run: cargo xtask check runtime --source-hash "$DOTFILES_TEST_SOURCE_HASH"
