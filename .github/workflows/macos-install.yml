name: macOS Nix install

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "手動実行する検証シナリオ"
        required: true
        default: all
        type: choice
        options:
          - all
          - fresh-bootstrap
          - second-user-home-manager
          - darwin-switch-ya
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    access-tokens = github.com=${{ github.token }}

jobs:
  fresh-bootstrap:
    name: ゼロ状態から bootstrap を検証
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'fresh-bootstrap' }}
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: flake.lock を確認
        run: test -s flake.lock

      - name: runner 情報
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          id
          xcode-select -p

      - name: Nix 未導入を確認
        run: |
          set -euxo pipefail
          if command -v nix >/dev/null 2>&1; then
            echo "ゼロ状態の導入テストでは Nix 未導入を前提にします。" >&2
            command -v nix >&2
            exit 1
          fi

      - name: bootstrap 事前確認
        run: |
          set -euxo pipefail
          bash scripts/bootstrap.sh --dry-run --flake ya

      - name: ゼロ状態から clone / Nix / flake check を検証
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/dotfiles-bootstrap"
          bash scripts/bootstrap.sh \
            --repo "$GITHUB_WORKSPACE" \
            --dir "$RUNNER_TEMP/dotfiles-bootstrap" \
            --flake ya \
            --mode darwin \
            --no-switch

      - name: clone された checkout を確認
        run: |
          set -euxo pipefail
          test -d "$RUNNER_TEMP/dotfiles-bootstrap/.git"
          test -s "$RUNNER_TEMP/dotfiles-bootstrap/flake.lock"
          test "$(git -C "$RUNNER_TEMP/dotfiles-bootstrap" rev-parse HEAD)" = "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"

      - name: no-switch の副作用がないことを確認
        run: |
          set -euxo pipefail
          test ! -e /etc/bashrc.before-nix-darwin
          test ! -e /etc/zshrc.before-nix-darwin
          test ! -e /opt/homebrew/Library/Taps.before-nix-homebrew
          test ! -e /usr/local/Library/Taps.before-nix-homebrew
          before="$RUNNER_TEMP/no-switch-before.txt"
          after="$RUNNER_TEMP/no-switch-after.txt"
          : > "$before"
          for path in /etc/bashrc /etc/zshrc /opt/homebrew/Library/Taps /usr/local/Library/Taps; do
            if [[ -e "$path" ]]; then
              stat -f '%N %z %m %u %g %p' "$path" >> "$before"
            else
              printf 'missing %s\n' "$path" >> "$before"
            fi
          done

          bash "$RUNNER_TEMP/dotfiles-bootstrap/scripts/bootstrap.sh" \
            --dir "$RUNNER_TEMP/dotfiles-bootstrap" \
            --flake ya \
            --mode darwin \
            --no-switch

          : > "$after"
          for path in /etc/bashrc /etc/zshrc /opt/homebrew/Library/Taps /usr/local/Library/Taps; do
            if [[ -e "$path" ]]; then
              stat -f '%N %z %m %u %g %p' "$path" >> "$after"
            else
              printf 'missing %s\n' "$path" >> "$after"
            fi
          done
          diff -u "$before" "$after"

      - name: flake.lock 欠落時の失敗を確認
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/dotfiles-missing-lock"
          git clone "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dotfiles-missing-lock"
          rm "$RUNNER_TEMP/dotfiles-missing-lock/flake.lock"
          if bash "$GITHUB_WORKSPACE/scripts/bootstrap.sh" \
            --dir "$RUNNER_TEMP/dotfiles-missing-lock" \
            --flake ya \
            --mode darwin \
            --no-switch; then
            echo "flake.lock がない bootstrap が成功しました" >&2
            exit 1
          fi

      - name: flake check 失敗時の失敗を確認
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/dotfiles-broken-flake"
          git clone "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dotfiles-broken-flake"
          printf '\nthis is invalid nix\n' >> "$RUNNER_TEMP/dotfiles-broken-flake/flake.nix"
          if bash "$GITHUB_WORKSPACE/scripts/bootstrap.sh" \
            --dir "$RUNNER_TEMP/dotfiles-broken-flake" \
            --flake ya \
            --mode darwin \
            --no-switch; then
            echo "壊れた flake の bootstrap が成功しました" >&2
            exit 1
          fi

      - name: sops age key CLI の上書き拒否を確認
        run: |
          set -euxo pipefail
          key_dir="$RUNNER_TEMP/sops-key-test"
          mkdir -p "$key_dir"
          printf 'old-key\n' > "$key_dir/current.txt"
          printf 'new-key\n' > "$key_dir/new.txt"
          if bash scripts/bootstrap.sh \
            --dir "$RUNNER_TEMP/dotfiles-bootstrap" \
            --flake ya \
            --mode darwin \
            --no-switch \
            --sops-age-key-file "$key_dir/new.txt" \
            --sops-age-key-dest "$key_dir/current.txt"; then
            echo "異なる sops age key の上書きが成功しました" >&2
            exit 1
          fi
          test "$(cat "$key_dir/current.txt")" = "old-key"

      - name: bootstrap rollback self-test
        run: |
          set -euxo pipefail
          bash scripts/bootstrap.sh --self-test

  second-user-home-manager:
    name: 既存 Nix 環境で別ユーザーの Home Manager を検証
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'second-user-home-manager' }}
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: flake.lock を確認
        run: test -s flake.lock

      - name: runner 情報
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          id
          xcode-select -p

      - name: 先行ユーザーで Nix と flake check を準備
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/dotfiles-bootstrap"
          bash scripts/bootstrap.sh \
            --repo "$GITHUB_WORKSPACE" \
            --dir "$RUNNER_TEMP/dotfiles-bootstrap" \
            --flake ya \
            --mode darwin \
            --no-switch

      - name: 追加ユーザーを作成
        run: |
          set -euo pipefail
          if ! id dotfilesci >/dev/null 2>&1; then
            password="$(openssl rand -base64 24)"
            echo "::add-mask::$password"
            sudo sysadminctl -addUser dotfilesci -fullName "Dotfiles CI" -password "$password" -home /Users/dotfilesci
          fi
          set -x
          sudo createhomedir -c -u dotfilesci || true
          sudo mkdir -p /Users/dotfilesci
          sudo chown dotfilesci:staff /Users/dotfilesci
          sudo rm -rf /Users/dotfilesci/.dotfiles

      - name: 別ユーザーで Home Manager を適用
        run: |
          set -euxo pipefail
          sudo -H -u dotfilesci env \
            HOME=/Users/dotfilesci \
            USER=dotfilesci \
            LOGNAME=dotfilesci \
            SHELL=/bin/zsh \
            NIX_CONFIG="$NIX_CONFIG" \
            bash "$GITHUB_WORKSPACE/scripts/bootstrap.sh" \
              --repo "$GITHUB_WORKSPACE" \
              --dir /Users/dotfilesci/.dotfiles \
              --flake dotfilesci \
              --mode home-manager \
              --run-switch

      - name: 別ユーザーの移行後検証
        run: |
          set -euxo pipefail
          sudo -H -u dotfilesci test -d /Users/dotfilesci/.dotfiles/.git
          sudo -H -u dotfilesci test -s /Users/dotfilesci/.dotfiles/flake.lock
          sudo -H -u dotfilesci test -e /Users/dotfilesci/.nix-profile
          sudo -H -u dotfilesci test -L /Users/dotfilesci/.config/zsh
          sudo -H -u dotfilesci test -L /Users/dotfilesci/.config/nvim
          sudo -H -u dotfilesci zsh -lc '[[ "$(readlink "$HOME/.config/zsh")" == /nix/store/* ]]'
          sudo -H -u dotfilesci zsh -lc '[[ "$(readlink "$HOME/.config/nvim")" == /nix/store/* ]]'
          sudo -H -u dotfilesci bash -lc '
            set -euo pipefail
            profile="$HOME/.local/state/nix/profiles/home-manager"
            test -L "$profile"
            generation="$(readlink "$profile")"
            [[ "$generation" == home-manager-*-link ]]
            test -L "$HOME/.local/state/nix/profiles/$generation"
            store_target="$(readlink "$HOME/.local/state/nix/profiles/$generation")"
            [[ "$store_target" == /nix/store/* ]]
          '
          sudo -H -u dotfilesci env \
            HOME=/Users/dotfilesci \
            USER=dotfilesci \
            LOGNAME=dotfilesci \
            SHELL=/bin/zsh \
            NIX_CONFIG="$NIX_CONFIG" \
            /nix/var/nix/profiles/default/bin/nix --extra-experimental-features "nix-command flakes" eval --no-update-lock-file /Users/dotfilesci/.dotfiles#homeConfigurations.dotfilesci.activationPackage.drvPath

  darwin-switch-ya:
    name: 実運用 ya の nix-darwin switch を検証
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'darwin-switch-ya' }}
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: flake.lock を確認
        run: test -s flake.lock

      - name: runner 情報
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          id
          xcode-select -p

      - name: ya ユーザーを作成
        run: |
          set -euo pipefail
          if ! id ya >/dev/null 2>&1; then
            password="$(openssl rand -base64 24)"
            echo "::add-mask::$password"
            sudo sysadminctl -addUser ya -fullName "ya" -password "$password" -home /Users/ya
          fi
          set -x
          sudo createhomedir -c -u ya || true
          sudo mkdir -p /Users/ya
          sudo chown ya:staff /Users/ya
          sudo -H -u ya mkdir -p /Users/ya/Library/LaunchAgents
          sudo -H -u ya rm -f /Users/ya/Library/LaunchAgents/org.nix.colima.plist
          sudo -H -u ya ln -s /nix/store/missing-org.nix.colima.plist /Users/ya/Library/LaunchAgents/org.nix.colima.plist
          if [[ -d /opt/homebrew ]]; then
            sudo chown -R ya:admin /opt/homebrew
          fi

      - name: 実運用 ya を適用
        run: |
          set -euxo pipefail
          bash scripts/bootstrap.sh \
            --repo "$GITHUB_WORKSPACE" \
            --dir "$RUNNER_TEMP/dotfiles-ya-switch" \
            --flake ya \
            --mode darwin \
            --run-switch

      - name: 実運用 ya の移行後検証
        run: |
          set -euxo pipefail
          nix_bin="/nix/var/nix/profiles/default/bin/nix"
          ya_path="/etc/profiles/per-user/ya/bin:/run/current-system/sw/bin:/nix/var/nix/profiles/default/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          test -x "$nix_bin"
          sudo chown -R ya:staff "$RUNNER_TEMP/dotfiles-ya-switch"
          sudo -H -u ya env \
            HOME=/Users/ya \
            USER=ya \
            LOGNAME=ya \
            SHELL=/etc/profiles/per-user/ya/bin/zsh \
            PATH="$ya_path" \
            NIX_CONFIG="$NIX_CONFIG" \
            "$nix_bin" --extra-experimental-features "nix-command flakes" flake check --no-update-lock-file "$RUNNER_TEMP/dotfiles-ya-switch"
          sudo -H -u ya env \
            HOME=/Users/ya \
            USER=ya \
            LOGNAME=ya \
            SHELL=/etc/profiles/per-user/ya/bin/zsh \
            PATH="$ya_path" \
            NIX_CONFIG="$NIX_CONFIG" \
            "$nix_bin" --extra-experimental-features "nix-command flakes" eval --no-update-lock-file "$RUNNER_TEMP/dotfiles-ya-switch#homeConfigurations.ya.activationPackage.drvPath"
          sudo -H -u ya env \
            HOME=/Users/ya \
            USER=ya \
            LOGNAME=ya \
            SHELL=/etc/profiles/per-user/ya/bin/zsh \
            PATH="$ya_path" \
            NIX_CONFIG="$NIX_CONFIG" \
            "$nix_bin" --extra-experimental-features "nix-command flakes" eval --no-update-lock-file "$RUNNER_TEMP/dotfiles-ya-switch#darwinConfigurations.ya.system"
          test -d /etc/profiles/per-user/ya
          sudo -H -u ya bash -c '
            set -euo pipefail
            for managed_path in "$HOME/.config/zsh" "$HOME/.config/nvim" "$HOME/.zshrc" "$HOME/.zshenv"; do
              test -L "$managed_path"
              managed_target="$(readlink "$managed_path")"
              [[ "$managed_target" == /nix/store/* ]]
            done
          '
          sudo -H -u ya /etc/profiles/per-user/ya/bin/zsh -il -c '
            set -euo pipefail
            for tool in git gh jq rg fzf atuin zoxide nvim; do
              tool_path="$(command -v "$tool")"
              real_tool_path="${tool_path:A}"
              case "$real_tool_path" in
                /nix/store/*) ;;
                *)
                  echo "$tool resolved outside the Nix store: $tool_path -> $real_tool_path" >&2
                  exit 1
                  ;;
              esac
            done
          '
          brew="/opt/homebrew/bin/brew"
          sudo -H -u ya "$brew" tap | /usr/bin/grep -Fxq "azure/bicep"
          sudo -H -u ya "$brew" tap | /usr/bin/grep -Fxq "hashicorp/tap"
          if sudo -H -u ya "$brew" list --formula | /usr/bin/grep -Fxq "packer"; then
            echo "packer formula remains after Homebrew cleanup" >&2
            exit 1
          fi
          ls -la /Users/ya/Library || true
          ls -la /Users/ya/Library/LaunchAgents || true
          sudo -H -u ya ls -la /Users/ya/Library/LaunchAgents || true
          sudo -H -u ya find /Users/ya/Library -maxdepth 3 -name '*colima*.plist' -print || true
          sudo -H -u ya bash -c '
            set -euo pipefail
            plist="$HOME/Library/LaunchAgents/org.nix.colima.plist"
            old_plist="$HOME/Library/LaunchAgents/homebrew.mxcl.colima.plist"
            plist_target="$plist"
            activation_mode_file="$HOME/.local/state/nix/org.nix.colima.activation-mode"

            if [[ -L "$plist" ]]; then
              readlink "$plist"
            fi
            test -e "$plist"
            if [[ -L "$plist" ]]; then
              plist_target="$(readlink "$plist")"
              test -n "$plist_target"
              test -e "$plist_target"
            else
              test -f "$plist"
            fi
            test -s "$plist_target"
            test ! -e "$old_plist"
            /usr/bin/grep -Eq "/nix/store/.*/bin/colima" "$plist_target"
            test -f "$activation_mode_file"
            activation_mode="$(cat "$activation_mode_file")"
            case "$activation_mode" in
              loaded|installed-without-loading) ;;
              *)
                echo "unexpected activation mode: $activation_mode" >&2
                exit 1
                ;;
            esac
          '
          activation_mode="$(sudo -H -u ya cat /Users/ya/.local/state/nix/org.nix.colima.activation-mode)"
          uid="$(id -u ya)"
          if [[ "$activation_mode" == "loaded" ]]; then
            sudo -H -u ya launchctl print "gui/$uid/org.nix.colima" | tee "$RUNNER_TEMP/org.nix.colima.launchd"
            /usr/bin/grep -Eq "/nix/store/.*/bin/colima" "$RUNNER_TEMP/org.nix.colima.launchd"
            if sudo -H -u ya launchctl print "gui/$uid/homebrew.mxcl.colima" >/dev/null 2>&1; then
              echo "homebrew.mxcl.colima is still loaded" >&2
              exit 1
            fi
          else
            if sudo -H -u ya launchctl print "gui/$uid/homebrew.mxcl.colima" >/dev/null 2>&1; then
              echo "homebrew.mxcl.colima is still loaded" >&2
              exit 1
            fi
            echo "activation ended in $activation_mode; verified org.nix.colima plist placement and old plist removal"
          fi
