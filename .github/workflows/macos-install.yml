name: macOS Nix install

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "手動実行する導入シナリオ"
        required: true
        default: all
        type: choice
        options:
          - all
          - fresh-install
          - install-as-second-user
  pull_request:

permissions:
  contents: read

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    access-tokens = github.com=${{ github.token }}
  DOTFILES_REPO: https://github.com/${{ github.repository }}.git

jobs:
  fresh-install:
    name: ゼロ状態の macOS に導入
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'fresh-install' }}
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: flake.lock を確認
        run: test -s flake.lock

      - name: runner 情報
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          id
          xcode-select -p

      - name: bootstrap 事前確認
        run: |
          set -euxo pipefail
          DOTFILES_DRY_RUN=1 \
          DOTFILES_DIR="$GITHUB_WORKSPACE" \
          DOTFILES_FLAKE=runner \
          bash scripts/bootstrap.sh

      - name: ゼロ状態から Nix / nix-darwin を適用
        run: |
          set -euxo pipefail
          DOTFILES_DIR="$GITHUB_WORKSPACE" \
          DOTFILES_FLAKE=runner \
          DOTFILES_SWITCH_MODE=darwin \
          DOTFILES_RUN_SWITCH=1 \
          bash scripts/bootstrap.sh

      - name: 移行後検証
        run: |
          set -euxo pipefail
          VERIFY_MIGRATION_PHASE=post-migration VERIFY_FLAKE=runner bash scripts/verify-nix-migration.sh

  install-as-second-user:
    name: 既存 Nix 環境に別ユーザーで導入
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'install-as-second-user' }}
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: flake.lock を確認
        run: test -s flake.lock

      - name: runner 情報
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          id
          xcode-select -p

      - name: 先行ユーザーで Nix / nix-darwin を適用
        run: |
          set -euxo pipefail
          DOTFILES_DIR="$GITHUB_WORKSPACE" \
          DOTFILES_FLAKE=runner \
          DOTFILES_SWITCH_MODE=darwin \
          DOTFILES_RUN_SWITCH=1 \
          bash scripts/bootstrap.sh

      - name: 追加ユーザーを作成
        run: |
          set -euxo pipefail
          if ! id dotfilesci >/dev/null 2>&1; then
            sudo sysadminctl -addUser dotfilesci -fullName "Dotfiles CI" -password "$(openssl rand -base64 24)" -home /Users/dotfilesci
          fi
          sudo mkdir -p /Users/dotfilesci/.dotfiles
          sudo ditto "$GITHUB_WORKSPACE" /Users/dotfilesci/.dotfiles
          sudo chown -R dotfilesci:staff /Users/dotfilesci/.dotfiles

      - name: 別ユーザーで Home Manager を適用
        run: |
          set -euxo pipefail
          sudo -H -u dotfilesci env \
            HOME=/Users/dotfilesci \
            USER=dotfilesci \
            LOGNAME=dotfilesci \
            SHELL=/bin/zsh \
            NIX_CONFIG="$NIX_CONFIG" \
            DOTFILES_DIR=/Users/dotfilesci/.dotfiles \
            DOTFILES_FLAKE=dotfilesci \
            DOTFILES_SWITCH_MODE=home-manager \
            DOTFILES_RUN_SWITCH=1 \
            bash /Users/dotfilesci/.dotfiles/scripts/bootstrap.sh

      - name: 別ユーザーの移行後検証
        run: |
          set -euxo pipefail
          sudo -H -u dotfilesci env \
            HOME=/Users/dotfilesci \
            USER=dotfilesci \
            LOGNAME=dotfilesci \
            SHELL=/bin/zsh \
            NIX_CONFIG="$NIX_CONFIG" \
            VERIFY_FLAKE=dotfilesci \
            VERIFY_MIGRATION_PHASE=post-migration \
            bash /Users/dotfilesci/.dotfiles/scripts/verify-nix-migration.sh
