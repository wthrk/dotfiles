name: macOS runtime integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    access-tokens = github.com=${{ github.token }}
  DOTFILES_TEST_SOURCE_HASH: ${{ github.sha }}

jobs:
  # この runner がゲストそのものになる。checkout・Rust toolchain・Homebrew 除去でゲストを整え、
  # 最後にゲスト実行器をここでビルドして起動する。
  runtime:
    name: bootstrap から darwin switch まで検証
    # bootstrap と darwin switch は OS 版に依存するため、構成対象の実機と同じ macOS 26 に固定する。
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DOTFILES_TEST_SOURCE_HASH }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Use rustup toolchain binaries
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.cargo/bin"
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          ln -sf "$toolchain_bin"/* "$HOME/.cargo/bin/"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: reset Homebrew installation
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /opt/homebrew \
            /usr/local/Homebrew \
            /usr/local/Caskroom \
            /usr/local/Cellar \
            /usr/local/Frameworks \
            /usr/local/opt \
            /usr/local/var/homebrew \
            /usr/local/bin/brew

      - name: runtime integration
        run: cargo run --package dotfiles-integration-test-guest -- --source-hash "$DOTFILES_TEST_SOURCE_HASH"
