[package]
name = "dotfiles-cli"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "dotfiles_cli"
path = "src/lib.rs"

[[bin]]
name = "dotfiles"
path = "src/main.rs"

[[test]]
name = "secrets_cli"
path = "tests/secrets_cli.rs"
required-features = ["secrets-test-stub"]

[lints]
workspace = true

[features]
default = []
secrets-test-stub = []

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
dotfiles-core.workspace = true
dotfiles-cli-secrets-test-contract.workspace = true
nom.workspace = true
rand.workspace = true
region.workspace = true
rand_core.workspace = true
rlimit.workspace = true
rsa.workspace = true
scopeguard.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
strum.workspace = true
yubikey.workspace = true
zeroize.workspace = true

[dev-dependencies]
anyhow.workspace = true
dotfiles-cli-secrets-test-contract.workspace = true
portable-pty.workspace = true
