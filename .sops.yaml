# sops-nix scaffold for static secrets.
# Replace AGE recipients with real public keys before encrypting files.
keys:
  - &ya_host age1replacewithhostrecipientxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  - &ya_user age1replacewithuserrecipientxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
creation_rules:
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *ya_host
          - *ya_user
  - path_regex: secrets/hosts/.*\.yaml$
    key_groups:
      - age:
          - *ya_host
  - path_regex: secrets/users/.*\.yaml$
    key_groups:
      - age:
          - *ya_user
