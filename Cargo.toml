[workspace]
members = [
  "rust/dotfiles-cli",
  "rust/dotfiles-core",
  "rust/dotfiles-secrets",
  "rust/tests/checks",
  "rust/tests/integration",
  "rust/tests/integration/guest",
  "rust/xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.0.0"

[workspace.lints.clippy]
mod_module_files = "deny"
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
too_many_arguments = "deny"

[workspace.dependencies]
anyhow = "1.0.100"
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
async-openai = "0.28.3"
backoff = "0.4.0"
bitwarden = { version = "2.1.0", features = ["secrets"] }
bincode = { version = "2.0.1", features = ["serde"] }
clap = { version = "4.5.49", features = ["derive", "env"] }
crossterm = "0.29.0"
dotfiles-cli = { path = "rust/dotfiles-cli" }
dotfiles-core = { path = "rust/dotfiles-core" }
dotfiles-secrets = { path = "rust/dotfiles-secrets", default-features = false }
filedescriptor = "0.8.3"
git2 = "0.20.0"
gpgme = "0.11.0"
mockall = "0.13.1"
nom = "8.0.0"
rand = "0.9.2"
region = "3.0.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rlimit = "0.10.2"
rsa = { version = "0.9.8", features = ["sha2"] }
portable-pty = "0.9.0"
sequoia-openpgp = { version = "1.21.2", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
signal-hook = "0.4.4"
toml = "0.9.8"
scopeguard = "1.2.0"
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.48.0", features = ["rt", "net", "time"] }
url = "2.5.8"
uuid = "1.18.1"
xshell = "0.2"
yubikey = { version = "0.9.0-pre.0", features = ["untested"] }
zeroize = { version = "1.8.2", features = ["serde"] }
