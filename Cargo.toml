[workspace]
members = [
  "rust/dotfiles-cli",
  "rust/dotfiles-core",
  "rust/tests/checks",
  "rust/tests/integration",
  "rust/tests/integration/guest",
  "rust/xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.0.0"

[workspace.lints.clippy]
mod_module_files = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
anyhow = "1.0.100"
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
clap = { version = "4.5.49", features = ["derive", "env"] }
dotfiles-core = { path = "rust/dotfiles-core" }
nom = "8.0.0"
rand = "0.9.2"
region = "3.0.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rpassword = "7.5.2"
rlimit = "0.10.2"
rsa = { version = "0.9.8", features = ["sha2"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
signal-hook = "0.4.4"
strum = { version = "0.27.2", features = ["derive"] }
xshell = "0.2"
yubikey = { version = "0.9.0-pre.0", features = ["untested"] }
zeroize = "1.8.2"
