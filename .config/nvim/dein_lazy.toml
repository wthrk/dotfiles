[[plugins]]
repo = 'copy/deoplete-ocaml'
on_ft = 'ocaml'
hook_add = '''
  call deoplete#custom#option('ignore_sources', {})
  call deoplete#custom#option('ignore_sources.ocaml', ['buffer', 'around', 'member', 'tag'])
  call deoplete#custom#option('auto_complete_delay', 0)
'''

